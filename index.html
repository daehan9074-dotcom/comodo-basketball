/* =========================================================
 *  3. 선수 스탯
 * ========================================================= */
const RS_IDX={};RS_KEYS.forEach((k,i)=>{RS_IDX[k]=i});
const PS_DAYS=5;          // 참석일 기준 최근 5일
const PS_ACTIVE_MONTHS=2; // 이 기간 안에 기록이 없으면 표를 비운다

let psSummary=null,psDates=null,psCalY=0,psCalM=0,psVidDates=[];

document.getElementById('playerStatBtn').addEventListener('click',psOpenSummary);

function psNum(v,div){
  if(div===1)return String(v||0);
  return ((v||0)/(div||1)).toFixed(1);
}
function psHead(extra){
  return '<tr><th class="ps-name">선수</th>'+extra+
    RS_VIEW.map(c=>'<th>'+c.code+'<br><span style="font-weight:600;opacity:.8;font-size:.6rem">'+
      c.ko.replace(/<br>/g,'')+'</span></th>').join('')+'</tr>';
}
/* totals: 13개 배열, pts: 득점 합계, div: 나눌 값(1이면 합계) */
/* 한 행의 열별 원시값 (강조 비교용) */
function psRowVal(totals,pts,c){
  if(c.t==='pts')return pts;
  if(c.t==='pct'){const a=totals[RS_IDX[c.a]];return a>0?totals[RS_IDX[c.m]]/a:-1}
  return totals[RS_IDX[c.k]];
}
/* maxes 를 주면 그 값과 같은 칸에 배경색을 칠한다 (팀내 최고 수치 표시) */
function psCells(totals,pts,div,maxes){
  return RS_VIEW.map((c,i)=>{
    const txt=(c.t==='pts')?psNum(pts,div)
      :(c.t==='pct')?rsPct(totals[RS_IDX[c.m]],totals[RS_IDX[c.a]])
      :psNum(totals[RS_IDX[c.k]],div);
    let cls=(c.t==='pts')?'ps-pts':'';
    if(maxes&&maxes[i]!=null){
      const v=psRowVal(totals,pts,c);
      if(v>0&&v>=maxes[i]-1e-9)cls=(cls+' '+((c.t==='s'&&PS_NEG[c.k])?'ps-bad':'ps-top')).trim();
    }
    return '<td'+(cls?' class="'+cls+'"':'')+'>'+txt+'</td>';
  }).join('');
}
/* 한 팀 안에서 열별 최고값 */
function psTeamMaxes(rowsOf){
  return RS_VIEW.map(c=>{
    if(!psHighlightable(c))return null;
    const vals=rowsOf.map(x=>psRowVal(x.totals,x.pts,c)).filter(v=>v>0);
    return vals.length?Math.max.apply(null,vals):null;
  });
}

async function psOpenSummary(){
  openModal('<h3>📈 선수 스탯</h3><p class="ld">불러오는 중...</p>',true);
  try{
    const r=await fetchJsonp(SCRIPT_URL,{action:'stats',mode:'summary',days:PS_DAYS,activeMonths:PS_ACTIVE_MONTHS});
    if(!r||!r.ok){openModal('<h3>📈 선수 스탯</h3><p class="ld">기록을 불러오지 못했습니다.</p>'+
      '<div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">닫기</button>'+
      '<button class="btn-primary" onclick="psOpenSummary()">다시 시도</button></div>',true);return}
    psSummary=r;
    psRenderSummary();
  }catch(e){
    openModal('<h3>📈 선수 스탯</h3><p class="ld">통신에 실패했습니다.</p>'+
      '<div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">닫기</button>'+
      '<button class="btn-primary" onclick="psOpenSummary()">다시 시도</button></div>',true);
  }
}
/* 많을수록 나쁜 항목 → 옅은 빨강으로 칠한다 */
const PS_NEG={tov:1,pf:1};
/* 강조하지 않는 항목 (많이 던졌다고 잘한 건 아니므로 시도 개수는 제외) */
const PS_SKIP={p2a:1,p3a:1,fta:1};
function psHighlightable(c){return !(c.t==='s'&&PS_SKIP[c.k])}

/* 표에 표시되는 "경기당 평균" 값. 성공률은 합계 기준으로 계산한다. */
function psColVal(p,c){
  const g=p.games||1;
  if(c.t==='pts')return p.pts/g;
  if(c.t==='pct'){
    const a=p.totals[RS_IDX[c.a]];
    return a>0?p.totals[RS_IDX[c.m]]/a:-1;
  }
  return p.totals[RS_IDX[c.k]]/g;
}
/* 상위 10% 경계값 (동점이면 함께 포함) */
function psTopN(vals){
  const v=vals.filter(x=>x>0).sort((a,b)=>b-a);
  if(!v.length)return null;
  return v[Math.max(1,Math.ceil(v.length*0.1))-1];
}
function psThresholds(active){
  return RS_VIEW.map(c=>psHighlightable(c)?psTopN(active.map(p=>psColVal(p,c))):null);
}
/* 경기 승률 (승 ÷ 승패무 합) */
function psWinRate(p){
  const n=(p.wins||0)+(p.losses||0)+(p.draws||0);
  return n>0?(p.wins||0)/n:-1;
}
function psWinLabel(p){
  const w=p.wins||0,l=p.losses||0,d=p.draws||0;
  return d>0?(w+'-'+l+'-'+d):(w+'-'+l);
}
function psSumCells(p,ths){
  return RS_VIEW.map((c,i)=>{
    const v=psColVal(p,c);
    const hot=(ths[i]!=null&&v>0&&v>=ths[i]-1e-9);
    const cls=((c.t==='pts'?'ps-pts ':'')+
      (hot?((c.t==='s'&&PS_NEG[c.k])?'ps-bad':'ps-top'):'')).trim();
    const txt=(c.t==='pct')
      ? rsPct(p.totals[RS_IDX[c.m]],p.totals[RS_IDX[c.a]])
      : v.toFixed(1);
    return '<td'+(cls?' class="'+cls+'"':'')+'>'+txt+'</td>';
  }).join('');
}

function psRenderSummary(){
  const r=psSummary;
  if(!r){psOpenSummary();return}   // 개인 스탯부터 연 경우엔 목록을 새로 불러온다

  // 서버 집계를 이름으로 찾아쓰고, 회원 명단(게스트 제외)을 기준으로 표를 만든다
  const byName={};
  (r.players||[]).forEach(p=>{byName[p.name]=p});
  // 게스트는 누적 스탯 목록에서 빼고, 날짜별 보기에서는 그대로 남겨 둔다
  const roster=currentMembers.filter(m=>!m.isGuest&&m.memberType!=='게스트');
  const inRoster={};roster.forEach(m=>{inRoster[m.name]=1});
  const names=roster.length?roster.map(m=>m.name)
    :(r.players||[]).map(p=>p.name);            // 회원 명단을 못 불러왔을 때의 대비
  if(roster.length)(r.players||[]).forEach(p=>{if(inRoster[p.name]&&names.indexOf(p.name)<0)names.push(p.name)});

  const rows=names.map(n=>byName[n]||
    {name:n,active:false,games:0,days:0,pts:0,totals:new Array(RS_KEYS.length).fill(0)});

  // 경기 평균 득점순 (기록 없는 선수는 뒤로, 그 안에서는 이름순)
  rows.sort((a,b)=>{
    if(!!a.active!==!!b.active)return a.active?-1:1;
    if(!a.active)return a.name<b.name?-1:1;
    return (b.pts/(b.games||1))-(a.pts/(a.games||1));
  });

  const active=rows.filter(p=>p.active);
  const ths=psThresholds(active);

  const winTh=psTopN(active.map(p=>psWinRate(p)));
  const span=4+RS_VIEW.length;
  const body=rows.map(p=>{
    const nameCell='<td class="ps-name"><button class="ps-nb" onclick="psPlayer(\''+jsq(p.name)+'\')">'+esc(p.name)+'</button></td>';
    if(!p.active){
      return '<tr>'+nameCell+'<td class="ps-none" colspan="'+span+'">최근 경기 데이터가 없습니다.</td></tr>';
    }
    const wr=psWinRate(p);
    const wrCls=(winTh!=null&&wr>0&&wr>=winTh-1e-9)?' class="ps-top"':'';
    return '<tr>'+nameCell+'<td>'+p.days+'</td><td>'+p.games+'</td>'+
      '<td class="ps-wl">'+psWinLabel(p)+'</td>'+
      '<td'+wrCls+'>'+(wr<0?'-':Math.round(wr*100)+'%')+'</td>'+
      psSumCells(p,ths)+'</tr>';
  }).join('');

  openModal(
    '<div class="rs-hd"><h3>📈 선수 스탯</h3><div style="display:flex;gap:6px">'+rotateBtnHtml()+
    '<button class="rs-tool" onclick="psOpenCalendar()">📅 날짜별 보기</button></div></div>'+
    '<p class="ps-note">선수마다 <b>실제 참석한 최근 '+PS_DAYS+'일</b>의 기록을 모아 <b>경기 1게임당 평균</b>으로 계산합니다. '+
    '평균 득점이 높은 순으로 정렬됩니다.<br>'+
    '최근 '+PS_ACTIVE_MONTHS+'개월 안에 기록이 없는 선수는 비워 둡니다. '+
    '<b>게스트는 이 목록에서 빠지며</b>, 📅 날짜별 보기에서는 그대로 표시됩니다.'+
    (r.activeFrom?' (기준일 '+esc(r.activeFrom)+' 이후)':'')+'<br>'+
    '<span class="ps-top" style="padding:1px 7px;border-radius:5px">초록색</span> = 해당 항목 상위 10% · '+
    '<span class="ps-bad" style="padding:1px 7px;border-radius:5px">빨간색</span> = 턴오버·반칙 상위 10% '+
    '(시도 개수는 제외)<br>'+
    '승률은 같은 날·같은 게임의 상대 팀 득점과 비교해 계산합니다. (상대 기록이 없는 게임은 제외)</p>'+
    (active.length
      ? '<div class="rs-tblwrap"><table class="ps-tbl"><thead>'+
        psHead('<th>참석일</th><th>경기</th><th>승-패</th><th>W%<br><span style="font-weight:600;opacity:.8;font-size:.6rem">승률</span></th>')+'</thead>'+
        '<tbody>'+body+'</tbody></table></div>'+
        '<p class="ps-note" style="margin-top:9px">선수 이름을 누르면 게임별 기록을 볼 수 있습니다.</p>'
      : '<div class="rs-warn">최근 경기 데이터가 없습니다.</div>')+
    '<div style="text-align:center;margin-top:14px">'+
    '<button class="rs-tool" onclick="closeModal()">닫기</button></div>',
    true
  );
}

/* 이름 확인 뒤 '나의 스탯' 버튼 → 본인 게임 기록 바로 열기 */
function psMyStat(){
  if(!currentMember){toast('먼저 이름을 확인해 주세요','error');return}
  psPlayer(currentMember.name);
}

/* ===== 선수별 게임 기록 ===== */
async function psPlayer(name){
  openModal('<h3>📈 '+esc(name)+'</h3><p class="ld">불러오는 중...</p>',true);
  try{
    const r=await fetchJsonp(SCRIPT_URL,{action:'stats',mode:'player',name});
    if(!r||!r.ok){toast('불러오기 실패','error');psRenderSummary();return}
    // g = [날짜, 진행일, 게임, 팀, 유니폼색, ...스탯13, 득점]
    const gs=r.games||[];
    const vm=vidMap(r.videos);
    let hasVid=false;
    const rows=gs.map(g=>{
      const totals=g.slice(5,5+RS_KEYS.length);
      const pts=g[5+RS_KEYS.length];
      const c=g[4]||'#8d8d8d';
      const vu=vidFind(vm,g[0],g[2]);   // 그 날짜·게임의 영상 (없으면 그 날 전체 영상)
      if(vu)hasVid=true;
      return '<tr><td class="ps-name">'+(vu?vidLink(vu,g[0]):esc(g[0]))+'</td>'+
        '<td>'+esc(g[1]||'-')+'</td><td>'+esc(String(g[2]))+'</td>'+
        '<td><span class="rs-chip" style="background:'+esc(c)+';color:'+rsFg(c)+'">'+esc(g[3]||'-')+'</span></td>'+
        psCells(totals,pts,1)+'</tr>';
    }).join('');
    const s=r.summary;
    const foot=s
      ? '<tfoot><tr><td class="ps-name">합계</td><td colspan="2">'+s.days+'일 / '+s.games+'게임</td><td>-</td>'+
        psCells(s.totals,s.pts,1)+'</tr>'+
        '<tr><td class="ps-name">경기 평균</td><td colspan="2">전체 기간</td><td>-</td>'+
        psCells(s.totals,s.pts,s.games||1)+'</tr></tfoot>'
      : '';
    openModal(
      '<div class="rs-hd"><h3>📈 '+esc(name)+'</h3><div style="display:flex;gap:6px">'+rotateBtnHtml()+
      '<button class="rs-tool" onclick="psRenderSummary()">← 목록으로</button></div></div>'+
      (hasVid?'<p class="ps-note" style="margin-bottom:8px">'+
        '<span class="ps-yt">▶ 날짜</span>를 누르면 그 경기 영상이 새 창에서 열립니다.</p>':'')+
      (gs.length
        ? '<div class="rs-tblwrap"><table class="ps-tbl"><thead><tr>'+
          '<th class="ps-name">날짜</th><th>진행일</th><th>게임</th><th>팀</th>'+
          RS_VIEW.map(c=>'<th>'+c.code+'<br><span style="font-weight:600;opacity:.8;font-size:.6rem">'+
            c.ko.replace(/<br>/g,'')+'</span></th>').join('')+'</tr></thead>'+
          '<tbody>'+rows+'</tbody>'+foot+'</table></div>'
        : '<div class="rs-warn">최근 경기 데이터가 없습니다.</div>')+
      '<div style="text-align:center;margin-top:14px">'+
      '<button class="rs-tool" onclick="closeModal()">닫기</button></div>',
      true
    );
  }catch(e){toast('통신 실패','error');psRenderSummary()}
}

/* ===== 날짜별 보기 (캘린더) ===== */
async function psOpenCalendar(){
  if(!psDates){
    popupHtml('<p class="ld">기록이 있는 날짜를 불러오는 중...</p>');
    try{
      const r=await fetchJsonp(SCRIPT_URL,{action:'stats',mode:'dates'});
      psDates=(r&&r.dates)||[];
      psVidDates=(r&&r.videoDates)||[];
    }catch(e){psDates=[]}
  }
  if(!psDates.length){popupMsg('저장된 경기 기록이 없습니다.');return}
  const last=parseDate(psDates[psDates.length-1])||kstNow();
  psCalY=last.getFullYear();psCalM=last.getMonth();
  psRenderCalendar();
}
function psCalMove(d){
  psCalM+=d;
  if(psCalM<0){psCalM=11;psCalY--}
  if(psCalM>11){psCalM=0;psCalY++}
  psRenderCalendar();
}
function psRenderCalendar(){
  const first=new Date(psCalY,psCalM,1).getDay();
  const dim=new Date(psCalY,psCalM+1,0).getDate();
  let cells='';
  for(let i=0;i<first;i++)cells+='<div class="ps-cd empty"></div>';
  for(let d=1;d<=dim;d++){
    const ds=psCalY+'-'+('0'+(psCalM+1)).slice(-2)+'-'+('0'+d).slice(-2);
    const has=psDates.indexOf(ds)>=0;
    const vid=psVidDates.indexOf(ds)>=0;   // 영상 링크가 등록된 날짜
    cells+=has
      ? '<div class="ps-cd has'+(vid?' vid':'')+'" onclick="psPickDate(\''+ds+'\')">'+d+'</div>'
      : '<div class="ps-cd">'+d+'</div>';
  }
  popupHtml(
    '<h3>📅 날짜 선택</h3>'+
    '<div class="ps-calhd"><button onclick="psCalMove(-1)">‹</button>'+
    '<span>'+psCalY+'년 '+(psCalM+1)+'월</span>'+
    '<button onclick="psCalMove(1)">›</button></div>'+
    '<div class="ps-cwd">'+['일','월','화','수','목','금','토'].map(w=>'<div>'+w+'</div>').join('')+'</div>'+
    '<div class="ps-cal">'+cells+'</div>'+
    '<p class="ps-hint">초록색 날짜에만 기록이 있습니다.'+
    (psVidDates.length?'<br>오른쪽 아래 ▶ 표시는 영상 링크가 등록된 날짜입니다.':'')+'</p>'+
    '<div class="modal-actions"><button class="btn-secondary" onclick="closePopup()">닫기</button></div>'
  );
}
async function psPickDate(ds){
  closePopup();
  openModal('<h3>📈 '+esc(ds)+'</h3><p class="ld">불러오는 중...</p>',true);
  try{
    const r=await fetchJsonp(SCRIPT_URL,{action:'stats',mode:'date',date:ds});
    if(!r||!r.ok){toast('불러오기 실패','error');psRenderSummary();return}
    psRenderDate(r);
  }catch(e){toast('통신 실패','error');psRenderSummary()}
}
let psDayVid='';
function psOpenDayVid(){if(psDayVid)window.open(psDayVid,'_blank','noopener')}
function psRenderDate(r){
  const names=r.names||[];
  const vm=vidMap(r.videos);
  psDayVid=vidFind(vm,r.date,0);
  const chips=names.length
    ? '<div class="ps-chiprow">'+names.map(n=>'<span class="ps-chip">'+esc(n)+'</span>').join('')+'</div>'
    : '<div class="rs-warn">이 날짜의 기록이 없습니다.</div>';

  const sumRows=(r.players||[]).map(p=>
    '<tr><td class="ps-name"><button class="ps-nb" onclick="psPlayer(\''+jsq(p.name)+'\')">'+esc(p.name)+'</button></td>'+
    '<td>'+p.games+'</td>'+psCells(p.totals,p.pts,1)+'</tr>').join('');

  // 게임·팀별 기록지 (g = [게임, 팀, 유니폼색, 이름, ...스탯13, 득점])
  const groups={},order=[];
  (r.games||[]).forEach(g=>{
    const key=g[0]+'|'+g[1];
    if(!groups[key]){groups[key]={game:g[0],team:g[1],color:g[2],rows:[]};order.push(key)}
    groups[key].rows.push(g);
  });
  order.sort((a,b)=>{
    const x=groups[a],y=groups[b];
    return x.game===y.game?(x.team<y.team?-1:1):(x.game-y.game);
  });
  const detail=order.map(k=>{
    const gp=groups[k];
    const c=gp.color||'#8d8d8d';
    const tot=new Array(RS_KEYS.length).fill(0);
    let pts=0;
    const parsed=gp.rows.map(g=>({name:g[3],totals:g.slice(4,4+RS_KEYS.length),pts:g[4+RS_KEYS.length]}));
    const maxes=psTeamMaxes(parsed);   // 팀내 최고 수치
    const body=parsed.map(x=>{
      x.totals.forEach((v,i)=>{tot[i]+=v});
      pts+=x.pts;
      return '<tr><td class="ps-name">'+esc(x.name)+'</td>'+psCells(x.totals,x.pts,1,maxes)+'</tr>';
    }).join('');
    const gv=vidFind(vm,r.date,gp.game);
    return '<div class="ps-gtitle" style="background:'+esc(c)+';color:'+rsFg(c)+'">'+
      '<span>'+gp.game+'게임 · '+esc(gp.team)+'팀</span>'+
      (gv?vidLink(gv,'영상','ps-ytg'):'')+'</div>'+
      '<div class="rs-tblwrap"><table class="ps-tbl"><thead>'+psHead('')+'</thead><tbody>'+body+'</tbody>'+
      '<tfoot><tr><td class="ps-name">합계</td>'+psCells(tot,pts,1)+'</tr></tfoot></table></div>';
  }).join('');

  openModal(
    '<div class="rs-hd"><h3>📈 '+esc(r.date)+(r.day?' ('+esc(r.day)+')':'')+'</h3>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap">'+rotateBtnHtml()+
    (psDayVid?'<button class="rs-tool vid" onclick="psOpenDayVid()">▶ 영상 보기</button>':'')+
    '<button class="rs-tool" onclick="psOpenCalendar()">📅 다른 날짜</button>'+
    '<button class="rs-tool" onclick="psRenderSummary()">← 목록으로</button></div></div>'+
    '<div class="ps-note"><b>참석자 '+names.length+'명</b> (게스트 포함)</div>'+chips+
    '<p class="ps-note">아래 게임별 표에서 '+
    '<span class="ps-top" style="padding:1px 7px;border-radius:5px">초록색</span>은 팀내 최고 수치, '+
    '<span class="ps-bad" style="padding:1px 7px;border-radius:5px">빨간색</span>은 팀내 최다 턴오버·반칙입니다. '+
    '(시도 개수는 제외)</p>'+
    (sumRows
      ? '<div class="ps-note" style="font-weight:700;color:var(--green)">선수별 이 날 합계</div>'+
        '<div class="rs-tblwrap"><table class="ps-tbl"><thead>'+psHead('<th>경기</th>')+'</thead>'+
        '<tbody>'+sumRows+'</tbody></table></div>'
      : '')+
    detail+
    '<div style="text-align:center;margin-top:16px">'+
    '<button class="rs-tool" onclick="closeModal()">닫기</button></div>',
    true
  );
}

/* ===== 시작 ===== */
/* 첫 로딩 화면 닫기 (데이터가 준비되면 호출) */
function hideSplash(){
  const el=document.getElementById('splash');
  if(!el||el.classList.contains('gone'))return;
  // 캐시로 화면이 이미 완성된 경우(=아주 이른 시점)에는 페이드 없이 바로 치운다
  if(performance.now()<450){el.remove();return}
  el.classList.add('gone');
  setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el)},450);
}
function showInitError(){
  hideSplash();
  const c=document.getElementById('daysContainer');
  if(!c)return;
  c.innerHTML='<div style="padding:14px;text-align:center;color:#c0392b;font-size:.85rem">'+
    '데이터를 불러오지 못했습니다.<br>'+
    '<button type="button" class="tg-btn" style="margin-top:8px" onclick="retryInit()">다시 시도</button></div>';
}
function retryInit(){
  const c=document.getElementById('daysContainer');
  if(c&&!dataReady)c.innerHTML='<div class="sk sk-block"></div><div class="sk sk-block"></div>';
  loadInit().then(r=>{if(!(r&&r.ok)&&!dataReady)showInitError()});
}
(function boot(){
  // 1) 캐시가 있으면 즉시 렌더 → 체감 로딩 0초 (로딩 화면도 바로 닫는다)
  const cached=readCache();
  if(cached){applyInit(cached);hideSplash()}

  // 2) <head> 에서 이미 시작해 둔 요청 결과로 최신화
  loadInit(window.__initReq).then(r=>{
    if(!(r&&r.ok)&&!dataReady)showInitError();
    hideSplash();
  });
  // 통신이 아주 느려도 8초 뒤에는 화면을 연다 (그 뒤엔 스켈레톤이 보인다)
  setTimeout(hideSplash,8000);

  // 3) Service Worker 등록 (HTTPS 환경에서만 동작, 아니면 조용히 건너뜀)
  registerSW();
})();

/* HTML·로고를 캐시해 재방문 시 네트워크 없이 화면을 띄운다.
   file:// 이나 http:// 에서는 브라우저가 지원하지 않으므로 그냥 건너뛴다. */
function registerSW(){
  if(!('serviceWorker' in navigator))return;
  const secure=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(!secure)return;
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      // 새 버전이 준비되면 알려준다 (이미 캐시로 화면이 떠 있는 상태이므로 강제 새로고침은 하지 않음)
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        if(!nw)return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            toast('새 버전이 있습니다. 새로고침해 주세요','success');
          }
        });
      });
    }).catch(e=>console.warn('SW 등록 건너뜀',e));
  });
}
