<!DOCTYPE html>

<title>코모도 농구 참석자 현황</title>
<!--
  ⚙️ 설정:
  1. 아래 SCRIPT_URL 을 본인 Apps Script 웹앱 주소로 바꾸세요
  2. 팀 로고는 같은 폴더에 logo.png 로 저장하세요 (파일이 없으면 자동 숨김)
  3. 관리자 비밀번호는 기본 1234 (apps-script-code.js의 ADMIN_PW 에서 변경)
-->
<script>
/* ===== ⚡ 최우선 초기 데이터 요청 =====
   CSS/폰트 로딩과 병렬로 init 요청을 먼저 띄운다 (body 스크립트를 기다리지 않음) */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzMIHc-An1WwdWQdRnUe13KYk-VWOivULbh4uRaVdxze_--0l0g-PhZu_su89ssjE0d/exec";

function fetchJsonp(url, payload){
  return new Promise((resolve,reject)=>{
    const cb='__jcb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
    const script=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();reject(new Error('시간 초과'))},20000);
    window[cb]=(d)=>{clearTimeout(timer);cleanup();resolve(d)};
    function cleanup(){delete window[cb];if(script.parentNode)script.parentNode.removeChild(script)}
    let full=url+(url.includes('?')?'&':'?')+'callback='+cb;
    if(payload){full+='&payload='+encodeURIComponent(JSON.stringify(payload))}
    script.src=full;
    script.onerror=()=>{clearTimeout(timer);cleanup();reject(new Error('요청 실패'))};
    (document.head||document.documentElement).appendChild(script);
  });
}
window.__initReq = fetchJsonp(SCRIPT_URL, {action:'init'}).catch(e=>{console.warn('init 실패',e);return null});
</script>

<style>
  :root{
    --green:#2c5f2e; --green-mid:#3d7a3f; --green-light:#e8f4e8;
    --green-stripe:#f0f7f0; --beige:#f5f2ec; --white:#fff;
    --field-bg:#fafaf8; --border:#d4cfc7; --text:#1a1a1a;
    --label:#6b6560; --error:#c0392b; --shadow:0 4px 24px rgba(44,95,46,.10),0 1px 6px rgba(0,0,0,.06);
    /* 웹폰트 대신 기기 내장 폰트 사용 → 다운로드 0바이트, 텍스트 즉시 표시.
       한글은 글리프 단위 폴백으로 맑은고딕(윈도우)/애플산돌고딕(맥·아이폰)이 자동 적용됩니다. */
    --font:system-ui,-apple-system,'Segoe UI',Roboto,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','맑은 고딕',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--beige);color:var(--text);min-height:100vh;padding:28px 14px 80px;-webkit-text-size-adjust:100%}
  /* 아래 카드(흰 테두리)와 정확히 같은 폭. 넘칠 일이 없도록 버튼이 남는 폭을 나눠 쓴다 */
  .top-bar{max-width:600px;margin:0 auto 14px;display:flex;justify-content:flex-end;align-items:stretch;gap:8px;overflow:hidden}
  .top-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;background:var(--white);border:1.5px solid var(--green);color:var(--green);padding:8px 14px;border-radius:10px;font-family:inherit;font-size:.82rem;font-weight:600;line-height:1.25;white-space:nowrap;cursor:pointer;transition:.18s}
  .top-btn:hover{background:var(--green);color:#fff}
  .top-btn .tb-ic{line-height:1}
  .top-btn .tb-tx-s{display:none}
  .top-btn.icon-only .tb-tx,.top-btn.icon-only .tb-tx-s{display:none}
  /* 좀은 화면: 메뉴 6개를 한 줄에 (텍스트 축약 + 균등 분할) */
  @media(max-width:620px){
    .top-bar{gap:4px;justify-content:space-between}
    .top-btn{flex:1 1 0;min-width:0;gap:3px;padding:7px 4px;border-radius:9px;font-size:.68rem}
    .top-btn .tb-tx{display:none}
    .top-btn .tb-tx-s{display:inline}
    .top-btn.icon-only{flex:0 0 auto;padding:7px 10px;font-size:.9rem}
  }
  /* 더 좁은 화면: 아이콘 위 / 글자 아래로 쌓아 폭을 줄인다 */
  @media(max-width:430px){
    .top-btn{flex-direction:column;gap:2px;padding:6px 3px;font-size:clamp(.5rem,2.5vw,.64rem)}
    .top-btn .tb-ic{font-size:1.05rem}
    .top-btn.icon-only{padding:6px 9px;font-size:1.05rem}
  }
  .card{background:var(--white);max-width:600px;margin:0 auto;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}

  /* 헤더: 흰 배경 + 검정 텍스트 + 큰 로고 */
  .card-header{background:#fff;padding:28px 32px 22px;text-align:center;border-bottom:1px solid #eee}
  .team-logo{max-width:130px;max-height:110px;margin:0 auto 14px;display:block;object-fit:contain}
  .card-header h1{color:#1a1a1a;font-size:1.45rem;font-weight:700;letter-spacing:-.3px;line-height:1.3}
  .card-header p{color:#666;font-size:.85rem;margin-top:6px}
  .card-body{padding:28px 32px 32px}

  .notice-box{background:#fff8e6;border:1.5px solid #f0d98a;border-radius:12px;padding:14px 16px;margin-bottom:22px}
  .notice-box .notice-label{font-size:.7rem;font-weight:700;color:#a87d00;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
  .notice-box .notice-content{font-size:.9rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .notice-box .notice-empty{color:#9a8f76;font-size:.85rem}

  .comment-box{background:#eef5fa;border:1.5px solid #9dc8e8;border-radius:12px;padding:14px 16px;margin-bottom:22px}
  .comment-box .comment-label{font-size:.7rem;font-weight:700;color:#2d6ea5;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  .comment-box .comment-item{font-size:.88rem;line-height:1.55;padding:3px 0;word-break:break-word}
  .comment-box .comment-item b{color:#2d6ea5;font-weight:700;margin-right:4px}
  .comment-box .comment-empty{color:#8ba8be;font-size:.85rem}

  .field{margin-bottom:22px}
  .field label.main-label{display:block;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--label);margin-bottom:8px}
  .field label.main-label .required{color:var(--green);margin-left:3px}
  input[type="text"],input[type="password"],input[type="number"],input[type="url"],textarea,select{width:100%;background:var(--field-bg);border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-family:inherit;font-size:.93rem;color:var(--text);transition:.2s;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(44,95,46,.1)}
  textarea{resize:vertical;min-height:90px;line-height:1.6}

  .name-row{display:flex;gap:8px}
  .name-row input{flex:1}
  .name-row .btn-check{background:var(--green);color:#fff;border:none;padding:0 18px;border-radius:10px;font-family:inherit;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap;transition:.18s}
  .name-row .btn-check:hover{background:var(--green-mid)}
  .name-row .btn-check:disabled{opacity:.6;cursor:not-allowed}

  .member-info{display:none;margin-top:10px;background:var(--green-light);border:1.5px solid var(--green);border-radius:10px;padding:12px 14px}
  .member-info.show{display:block}
  .member-info .mi-row{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:.85rem}
  .member-info .mi-row span{display:inline-flex;gap:4px}
  .member-info .mi-row b{color:var(--green);font-weight:700}
  .member-info .mi-badge{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:100px;font-size:.72rem;font-weight:700}
  /* 회원 정보 + 오른쪽 '나의 스탯' 버튼 */
  .member-info .mi-hd{display:flex;align-items:flex-start;gap:10px}
  .member-info .mi-body{flex:1 1 auto;min-width:0}
  .member-info .mi-stat{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;background:var(--green);border:none;
    color:#fff;padding:9px 12px;border-radius:9px;font-family:inherit;font-size:.78rem;font-weight:700;
    white-space:nowrap;cursor:pointer;transition:.18s}
  .member-info .mi-stat:hover{background:var(--green-mid)}
  @media(max-width:430px){.member-info .mi-stat{padding:8px 9px;font-size:.72rem}}
  .mi-badge.paid{background:#e8f4e8;color:#2c5f2e;border:1px solid #2c5f2e}
  .mi-badge.unpaid{background:#fdecea;color:#c0392b;border:1px solid #c0392b}
  .mi-badge.reg{background:#e6f0fa;color:#1f4e8a;border:1px solid #1f4e8a}
  .mi-badge.unreg{background:#fff4e6;color:#c27800;border:1px solid #e0a43e}
  .inactive-notice{margin-top:8px;color:#c0392b;font-size:.88rem;font-weight:600;text-align:center}
  .prev-vote{display:none;margin-top:8px;background:#fff4e6;border:1.5px solid #ffb74d;border-radius:8px;padding:10px 12px;font-size:.82rem;color:#c27800}
  .prev-vote.show{display:block}

  /* 요일 블록 */
  .day-block{background:var(--field-bg);border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;transition:.18s;cursor:pointer}
  .day-block.checked{border-color:var(--green);background:var(--green-light)}
  .day-block-top{display:flex;align-items:center;gap:10px}
  .day-block-top input[type="checkbox"]{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
  .day-block-top .day-title{font-weight:700;font-size:1rem;color:var(--text)}
  .day-block-top .day-title .day-tag{margin-left:6px;font-size:.72rem;background:var(--green);color:#fff;padding:2px 8px;border-radius:100px;font-weight:600}
  .day-desc{margin-top:6px;padding-left:28px;font-size:.82rem;color:var(--label);line-height:1.6;white-space:pre-wrap;word-break:break-word}

  .error-msg{display:none;font-size:.78rem;color:var(--error);margin-top:6px}
  .field.has-error .error-msg{display:block}
  .field.has-error input,.field.has-error textarea{border-color:var(--error)}

  .btn-submit{width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:.97rem;font-weight:700;letter-spacing:.02em;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
  .btn-submit:hover:not(:disabled){background:var(--green-mid);box-shadow:0 4px 14px rgba(44,95,46,.3);transform:translateY(-1px)}
  .btn-submit:disabled{opacity:.75;cursor:not-allowed}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite;display:none}
  .btn-submit.loading .spinner{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .success-screen{display:none;padding:56px 32px;text-align:center;flex-direction:column;align-items:center}
  .success-screen.show{display:flex}
  .success-icon{width:68px;height:68px;border-radius:50%;background:var(--green-light);border:3px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:1.9rem;color:var(--green);margin-bottom:18px;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
  @keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .success-screen h2{font-size:1.3rem;font-weight:700;color:var(--green);margin-bottom:10px}
  .success-screen p{font-size:.88rem;color:var(--label);line-height:1.7;margin-bottom:24px}
  .btn-reset{padding:11px 26px;border:2px solid var(--green);background:transparent;color:var(--green);border-radius:10px;font-family:inherit;font-weight:600;cursor:pointer;transition:.18s}
  .btn-reset:hover{background:var(--green);color:#fff}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a1a;color:#fff;padding:11px 22px;border-radius:100px;font-size:.85rem;font-weight:500;opacity:0;pointer-events:none;transition:.3s;z-index:2000}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.success{background:var(--green)}
  .toast.error{background:#c0392b}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1500;padding:16px;animation:fadeIn .2s}
  .modal-backdrop.show{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h3{color:var(--green);font-size:1.15rem;margin-bottom:14px;font-weight:700}
  .modal-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .modal-actions button{flex:1;min-width:100px;padding:10px;border-radius:10px;font-family:inherit;font-weight:600;cursor:pointer;font-size:.88rem;border:none;transition:.18s}
  .btn-primary{background:var(--green);color:#fff}
  .btn-primary:hover{background:var(--green-mid)}
  .btn-secondary{background:#eee;color:#333}
  .btn-secondary:hover{background:#ddd}
  .btn-danger{background:#c0392b;color:#fff}
  .btn-danger:hover{background:#a63222}
  .modal p{font-size:.9rem;line-height:1.6;margin-bottom:10px}

  /* 관리자 패널 */
  .admin-day-row{border:1.5px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--field-bg)}
  .admin-day-row .sub-label{display:block;font-size:.7rem;font-weight:700;color:var(--label);letter-spacing:.05em;text-transform:uppercase;margin:4px 0 4px}
  .admin-day-row input,.admin-day-row textarea{margin-bottom:4px}
  .admin-day-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
  .btn-sm{padding:5px 10px;font-size:.78rem;border-radius:6px;cursor:pointer;border:none;font-family:inherit;font-weight:600}
  .btn-sm.btn-danger{background:#c0392b;color:#fff}

  /* 참가 현황/팀 */
  .status-section{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #eee}
  .status-section:last-child{border:none}
  .status-section h4{font-size:.95rem;color:var(--green);margin-bottom:10px;font-weight:700}
  .status-section.none h4{color:#444}
  .status-row{display:flex;justify-content:space-between;padding:6px 0;font-size:.86rem;border-bottom:1px dashed #eee}
  .status-row:last-child{border:none}
  .status-row .tag{display:inline-block;padding:2px 8px;border-radius:100px;font-size:.72rem;font-weight:700;margin-right:6px}
  .tag-yes{background:#e8f4e8;color:#2c5f2e}
  .tag-no{background:#fdecea;color:#c0392b}
  .tag-none{background:#eee;color:#666}
  .status-names{font-size:.82rem;color:#666;margin-top:4px;line-height:1.5}

  .tg-field{margin-bottom:14px}
  .tg-field label{display:block;font-size:.78rem;font-weight:700;color:var(--label);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
  .tg-btn-row{display:flex;gap:6px;flex-wrap:wrap}
  .tg-btn{padding:8px 14px;border:1.5px solid var(--border);background:var(--field-bg);border-radius:8px;cursor:pointer;font-family:inherit;font-size:.85rem;transition:.15s}
  .tg-btn.active{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
  .team-box{border:2px solid var(--green);border-radius:10px;padding:10px;background:#fafff9;min-height:80px}
  .team-box h5{color:var(--green);font-size:.95rem;margin-bottom:8px;font-weight:700;text-align:center;padding-bottom:6px;border-bottom:1px solid #d4e5d4}
  .team-member{background:#fff;border:1px solid #d4e5d4;border-radius:6px;padding:5px 8px;margin-bottom:4px;font-size:.8rem;display:flex;justify-content:space-between;align-items:center}
  .team-member .pos{color:var(--green);font-weight:700;font-size:.72rem}
  .team-member button{background:none;border:none;color:#c0392b;cursor:pointer;font-size:.9rem;padding:0 2px}
  .pool-box{border:2px dashed var(--border);border-radius:10px;padding:10px;margin-top:10px;min-height:60px}
  .pool-box h5{font-size:.85rem;color:var(--label);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
  .pool-player{display:inline-flex;align-items:center;gap:6px;background:var(--field-bg);border:1px solid var(--border);border-radius:100px;padding:4px 6px 4px 10px;margin:3px;font-size:.8rem;transition:.15s}
  .pool-player .pos{color:var(--green);font-weight:700;font-size:.7rem}
  .pool-player .pp-name{margin-right:2px}
  .pool-team-btns{display:inline-flex;gap:3px;margin-left:2px}
  .pool-team-btn{background:var(--green);color:#fff;border:none;border-radius:100px;min-width:22px;height:22px;padding:0 6px;font-size:.72rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .pool-team-btn:hover{background:#1e4d20}
  .pool-team-btn.pool-del{background:#c0392b}
  .pool-team-btn.pool-del:hover{background:#a63222}
  .tg-add-guest{margin-top:10px;background:var(--white);border:1.5px dashed var(--green);color:var(--green);padding:8px 14px;border-radius:10px;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;transition:.18s}
  .tg-add-guest:hover{background:var(--green-light)}
  .constraint-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:.82rem;flex-wrap:wrap}
  .constraint-row select{flex:1;min-width:100px;padding:6px;border-radius:6px;border:1px solid var(--border);font-size:.82rem}
  .constraint-row button{background:#c0392b;color:#fff;border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:.75rem}

  /* 복사 박스 */
  .copy-box{background:var(--green-light);border:1.5px solid var(--green);border-radius:10px;padding:12px 14px;margin-top:16px}
  .copy-box pre{font-family:var(--font);font-size:.9rem;line-height:1.75;white-space:pre-wrap;margin-bottom:10px;color:#1a1a1a}
  .btn-copy{background:var(--green);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;font-size:.85rem;transition:.18s}
  .btn-copy:hover{background:var(--green-mid)}

  /* 로딩 스켈레톤 */
  /* ===== 첫 로딩 화면: 농구공이 튀면서 돈다 ===== */
  #splash{position:fixed;inset:0;z-index:2500;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--beige);transition:opacity .35s ease}
  #splash.gone{opacity:0;pointer-events:none;visibility:hidden}
  #splash .bb-wrap{width:72px;height:72px;margin-bottom:9px;animation:bbUp .6s cubic-bezier(.33,0,.66,1) infinite alternate}
  #splash .bb{width:100%;height:100%;display:block;animation:spin 1.2s linear infinite}
  #splash .bb-sh{width:50px;height:9px;border-radius:50%;background:#2c5f2e;opacity:.5;
    animation:bbSh .6s cubic-bezier(.33,0,.66,1) infinite alternate}
  #splash .bb-tx{margin-top:20px;font-size:.86rem;font-weight:600;color:var(--green)}
  @keyframes bbUp{from{transform:translateY(4px)}to{transform:translateY(-24px)}}
  @keyframes bbSh{from{transform:scaleX(1);opacity:.5}to{transform:scaleX(.6);opacity:.18}}
  @media(prefers-reduced-motion:reduce){
    #splash .bb-wrap,#splash .bb,#splash .bb-sh{animation:none}
  }

  .sk{background:linear-gradient(90deg,#ececec 25%,#f6f6f6 37%,#ececec 63%);background-size:400% 100%;animation:skl 1.3s ease infinite;border-radius:8px}
  @keyframes skl{0%{background-position:100% 50%}100%{background-position:0 50%}}
  .sk-line{height:13px;margin:7px 0}
  .sk-block{height:74px;margin-bottom:10px;border-radius:12px}

  /* ===== 참석자 현황 한 줄 요약 ===== */
  .att-summary{display:flex;flex-wrap:nowrap;gap:10px;align-items:center;background:var(--green-light);border:1.5px solid #c6ddc6;border-radius:12px;padding:12px 15px;margin-bottom:20px}
  .att-summary .as-list{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
  .att-summary .as-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;background:var(--green);border:none;color:#fff;padding:7px 11px;border-radius:9px;font-family:inherit;font-size:.76rem;font-weight:700;white-space:nowrap;cursor:pointer;transition:.18s}
  .att-summary .as-btn:hover{background:var(--green-mid)}

<div class="modal-backdrop" id="alertLayer"><div class="modal" id="alertBox"></div></div>

<script>
// ⚙️ SCRIPT_URL 과 fetchJsonp 는 <head> 최상단 스크립트에 정의되어 있습니다
//    (초기 데이터 요청을 CSS/폰트 로딩과 병렬로 먼저 시작하기 위함)

/* ===== 상태 ===== */
let currentMember=null;
let prevAttendance=null;
let noticeText='';
let currentDays=[];        // [{id,title,desc}]
let currentAttendance=[];
let currentMembers=[];
let adminPw='';
let _statusOpen=false;     // 참가 현황 모달이 열려 있는지 (백그라운드 갱신 후 재렌더 판단용)
let _lastStatusHtml='';    // 동일 내용 재렌더 방지

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function toast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),2800);
}
function openModal(html,wide){
  _statusOpen=false;
  const box=document.getElementById('modalBox');
  box.className='modal'+(wide?' wide':'');   // 이전 모달의 상태 클래스(rs-minus 등)까지 초기화
  box.innerHTML=html;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){
  _statusOpen=false;
  if(typeof rsRotOff==='function')rsRotOff();   // 가로 보기 상태로 남지 않도록
  document.getElementById('modal').classList.remove('show');
}
document.getElementById('modal').addEventListener('click',(e)=>{if(e.target.id==='modal')closeModal()});
document.getElementById('alertLayer').addEventListener('click',(e)=>{if(e.target.id==='alertLayer')closePopup()});

/* ===== 초기 로드 (stale-while-revalidate) =====
   1) localStorage 캐시가 있으면 즉시 화면을 그린다 (네트워크 대기 0ms)
   2) 동시에 서버 최신 데이터를 받아 조용히 갱신한다 */
const CACHE_KEY='komodo_init_v1';
let dataReady=false;      // 한 번이라도 렌더된 적이 있는지 (캐시 포함)
let dataFresh=false;      // 이번 접속에서 서버 응답을 실제로 받았는지
let _initInflight=null;

function readCache(){
  try{
    const raw=localStorage.getItem(CACHE_KEY);
    if(!raw)return null;
    const o=JSON.parse(raw);
    return (o&&o.data&&o.data.ok)?o.data:null;
  }catch(e){return null}
}
function writeCache(data){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({t:Date.now(),data}))}catch(e){}
}
function applyInit(r){
  noticeText=r.notice||'';
  currentDays=r.days||[];
  currentAttendance=r.attendance||[];
  currentMembers=r.members||[];
  dataReady=true;
  renderNotice();
  renderComments();
  renderDays();
  renderAttSummary();
}
/* 서버 최신 데이터를 가져와 반영. 중복 호출은 진행 중인 요청에 합류한다. */
function loadInit(pending){
  if(_initInflight)return _initInflight;
  const req=pending||fetchJsonp(SCRIPT_URL,{action:'init'});
  _initInflight=Promise.resolve(req).then(r=>{
    if(r&&r.ok){dataFresh=true;applyInit(r);writeCache(r)}
    return r;
  }).catch(e=>{console.warn('init 실패',e);return null})
   .finally(()=>{_initInflight=null});
  return _initInflight;
}
function renderNotice(){
  const el=document.getElementById('noticeContent');
  if(noticeText.trim()){el.textContent=noticeText}
  else{el.innerHTML='<span class="notice-empty">공지사항이 없습니다.</span>'}
}
function getCommentHtml(){
  const items=currentAttendance.filter(a=>a.comment&&String(a.comment).trim());
  if(items.length===0)return '';
  return items.map(a=>'<div class="comment-item"><b>'+esc(a.name)+' :</b>'+esc(a.comment)+'</div>').join('');
}
function renderComments(){
  const list=document.getElementById('commentList');
  const html=getCommentHtml();
  list.innerHTML=html||'<span class="comment-empty">아직 남긴 한마디가 없습니다.</span>';
}
let _daysContainerBound=false;
let _daysSig='';
// 현재 체크된 항목(요일 제목 / '모두 불참')을 수집
function getCheckedDayTitles(){
  const out=[];
  document.querySelectorAll('#daysContainer input[type="checkbox"]').forEach(cb=>{if(cb.checked)out.push(cb.value)});
  return out;
}
function renderDays(){
  const c=document.getElementById('daysContainer');
  if(!c)return;
  // 백그라운드 갱신으로 요일 구성이 그대로면 다시 그리지 않는다
  // (다시 그리면 사용자가 체크해 둔 항목이 초기화됨)
  const sig=JSON.stringify(currentDays);
  if(sig===_daysSig&&c.querySelector('input[type="checkbox"]'))return;
  const keep=getCheckedDayTitles();   // 구성이 바뀐 경우에도 선택은 최대한 보존
  const blocks=currentDays.map((d)=>
    '<div class="day-block" data-day="'+esc(d.id)+'" id="block-'+esc(d.id)+'">'+
      '<div class="day-block-top">'+
        '<input type="checkbox" id="day-'+esc(d.id)+'-cb" value="'+esc(d.title)+'" />'+
        '<label for="day-'+esc(d.id)+'-cb" style="cursor:pointer"><span class="day-title">'+esc(d.title)+'<span class="day-tag">'+esc(String(d.id||'').toUpperCase())+'</span></span></label>'+
      '</div>'+
      '<div class="day-desc">'+esc(d.desc)+'</div>'+
    '</div>'
  ).join('');
  const noneBlock=
    '<div class="day-block" data-day="none" id="block-none">'+
      '<div class="day-block-top">'+
        '<input type="checkbox" id="day-none-cb" value="모두 불참" />'+
        '<label for="day-none-cb" style="cursor:pointer"><span class="day-title">모두 불참</span></label>'+
      '</div>'+
      '<div class="day-desc">이번 주는 참석이 어려워요.</div>'+
    '</div>';
  c.innerHTML=blocks+noneBlock;
  _daysSig=sig;
  attachDayEvents();
  if(keep.length)fillDays(keep); else updateDayBlocks();
}
function attachDayEvents(){
  if(_daysContainerBound)return;
  const c=document.getElementById('daysContainer');
  if(!c)return;
  c.addEventListener('click',(e)=>{
    const block=e.target.closest('.day-block');
    if(!block)return;
    if(e.target.tagName==='INPUT'||e.target.tagName==='LABEL')return;
    const cb=block.querySelector('input[type="checkbox"]');
    if(!cb)return;
    cb.checked=!cb.checked;
    handleDayChange(cb);
  });
  c.addEventListener('change',(e)=>{
    if(e.target.matches('input[type="checkbox"]'))handleDayChange(e.target);
  });
  _daysContainerBound=true;
}
function updateDayBlocks(){
  document.querySelectorAll('.day-block').forEach(b=>{
    const cb=b.querySelector('input[type="checkbox"]');
    b.classList.toggle('checked',!!(cb&&cb.checked));
  });
}
function handleDayChange(cb){
  const noneCb=document.getElementById('day-none-cb');
  if(cb.id==='day-none-cb'&&cb.checked){
    document.querySelectorAll('.day-block input[type="checkbox"]').forEach(c=>{if(c.id!=='day-none-cb')c.checked=false});
  }else if(cb.checked&&cb.id!=='day-none-cb'){
    if(noneCb)noneCb.checked=false;
  }
  updateDayBlocks();
}

/* ===== 이름 확인 ===== */
document.getElementById('checkBtn').addEventListener('click',checkName);
document.getElementById('name').addEventListener('keydown',(e)=>{if(e.key==='Enter'){e.preventDefault();checkName()}});

// 회원 명단은 init 으로 이미 받아둔 상태이므로 서버 왕복 없이 즉시 조회한다
function lookupMemberLocal(name){
  const m=currentMembers.find(x=>String(x.name||'').trim()===name);
  if(!m)return {ok:false,message:'명단에 없는 이름입니다'};
  const a=currentAttendance.find(x=>String(x.name||'').trim()===name);
  return {ok:true,member:m,prevAttendance:a?{days:a.days||[],comment:a.comment||''}:null};
}
async function checkName(){
  const name=document.getElementById('name').value.trim();
  if(!name){toast('이름을 입력하세요','error');return}
  const btn=document.getElementById('checkBtn');
  btn.disabled=true;btn.textContent='확인중...';
  try{
    // 진행 중인 갱신이 있으면 먼저 기다린다.
    // (localStorage 캐시는 주간 초기화 전 데이터일 수 있어 '이전 투표 기록'을 잘못 띄울 수 있음)
    if(_initInflight){try{await _initInflight}catch(e){}}
    // 이번 접속에서 서버 응답을 받았을 때만 로컬 조회(0ms), 아니면 서버에 직접 확인
    const r=dataFresh
      ? lookupMemberLocal(name)
      : await fetchJsonp(SCRIPT_URL,{action:'checkMember',name});
    if(!r.ok){
      document.getElementById('memberInfo').classList.remove('show');
      document.getElementById('prevVote').classList.remove('show');
      currentMember=null;prevAttendance=null;
      toast(r.message||'명단에 없는 이름입니다','error');
      return;
    }
    currentMember=r.member;
    prevAttendance=r.prevAttendance;
    showMemberInfo(r.member);
    if(r.prevAttendance){
      document.getElementById('prevVote').innerHTML=
        '⚠️ 이전에 투표한 기록이 있습니다: <b>'+(r.prevAttendance.days||[]).map(esc).join(', ')+'</b><br>제출 시 이전 내용이 수정됩니다.';
      document.getElementById('prevVote').classList.add('show');
      fillDays(r.prevAttendance.days||[]);
      const ci=document.getElementById('commentInput');
      if(ci)ci.value=r.prevAttendance.comment||'';
    }
    toast('본인 확인 완료','success');
  }catch(e){toast('서버 통신 실패','error');console.error(e)}
  finally{btn.disabled=false;btn.textContent='확인'}
}
function showMemberInfo(m){
  const info=document.getElementById('memberInfo');
  const hideBadges=m.isInactive||m.isGuest;
  const fee=hideBadges?'':(m.paid?'<span class="mi-badge paid">회비 납부 완료</span>':'<span class="mi-badge unpaid">회비 미납</span>');
  const reg=hideBadges?'':(m.registered?'<span class="mi-badge reg">선수등록 완료</span>':'<span class="mi-badge unreg">선수등록 미완료</span>');
  const badges=[fee,reg].filter(Boolean).join(' ');
  let notice='';
  if(m.isGuest)notice='<div class="inactive-notice">현재 게스트입니다. 참석 가능한 날을 선택해주세요.</div>';
  else if(m.isInactive)notice='<div class="inactive-notice">현재 휴활 회원입니다. 참석 가능한 날을 선택해주세요.</div>';
  const numberSpan=m.isGuest?'':'<span><b>등번호</b>'+esc(m.number||'-')+'</span>';
  info.innerHTML=
    '<div class="mi-hd"><div class="mi-body">'+
    '<div class="mi-row">'+
    '<span><b>이름</b>'+esc(m.name)+'</span>'+
    '<span><b>나이</b>'+esc((m.age===''||m.age==null)?'-':m.age)+'</span>'+
    numberSpan+
    '<span><b>포지션</b>'+esc(m.position||'-')+'</span>'+
    '</div>'+
    (badges?'<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">'+badges+'</div>':'')+
    '</div>'+
    '<button type="button" class="mi-stat" onclick="psMyStat()">📈 나의 스탯</button>'+
    '</div>'+
    notice;
  info.classList.add('show');
  if(m.isGuest){toast('게스트로 참석합니다','success')}
  else if(m.isInactive){toast('현재 휴활 회원입니다','error')}
}
function fillDays(days){
  currentDays.forEach(d=>{
    const cb=document.getElementById('day-'+d.id+'-cb');
    if(cb)cb.checked=days.includes(d.title);
  });
  const noneCb=document.getElementById('day-none-cb');
  if(noneCb)noneCb.checked=days.includes('모두 불참');
  updateDayBlocks();
}

/* ===== 제출 ===== */
document.getElementById('surveyForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  clearErrors();
  if(!currentMember){setErr('field-name','이름을 입력하고 확인 버튼을 눌러주세요.');return}
  const days=[];
  currentDays.forEach(d=>{
    const cb=document.getElementById('day-'+d.id+'-cb');
    if(cb&&cb.checked)days.push(d.title);
  });
  const noneCb=document.getElementById('day-none-cb');
  if(noneCb&&noneCb.checked)days.push('모두 불참');
  if(days.length===0){setErr('field-days','참석 가능일을 선택해 주세요.');return}

  const commentEl=document.getElementById('commentInput');
  const comment=commentEl?commentEl.value.trim():'';

  if(prevAttendance){
    const ok=await confirmModal('이전 제출 기록이 있습니다. 내용을 수정하시겠습니까?');
    if(!ok)return;
  }

  const btn=document.getElementById('submitBtn');
  btn.classList.add('loading');btn.disabled=true;
  btn.querySelector('.btn-text').textContent='처리 중...';
  try{
    const r=await fetchJsonp(SCRIPT_URL,{action:'submit',name:currentMember.name,days:days,comment:comment});
    if(r.ok){
      document.getElementById('formWrapper').style.display='none';
      document.getElementById('successScreen').classList.add('show');
      document.getElementById('successMsg').textContent=prevAttendance?'이전 기록이 수정되었습니다.':'참석 정보가 저장되었습니다.';
      toast('저장 완료','success');
      loadInit();   // 방금 제출한 내용으로 캐시 갱신 (백그라운드)
    }else{toast(r.message||'저장 실패','error')}
  }catch(err){console.error(err);toast('통신 실패','error')}
  finally{
    btn.classList.remove('loading');btn.disabled=false;
    btn.querySelector('.btn-text').textContent='제출하기';
  }
});
function setErr(id,msg){const f=document.getElementById(id);f.classList.add('has-error');f.querySelector('.error-msg').textContent=msg}
function clearErrors(){document.querySelectorAll('.field').forEach(f=>f.classList.remove('has-error'))}
function confirmModal(msg){
  return new Promise(res=>{
    openModal('<h3>확인</h3><p>'+esc(msg)+'</p><div class="modal-actions"><button class="btn-secondary" onclick="window._cfm(false)">취소</button><button class="btn-primary" onclick="window._cfm(true)">확인</button></div>');
    window._cfm=(v)=>{closeModal();res(v)};
  });
}

document.getElementById('resetBtn').addEventListener('click',()=>{
  document.getElementById('surveyForm').reset();
  updateDayBlocks();   // reset() 은 체크만 풀고 .checked 강조는 남으므로 직접 갱신
  const ci=document.getElementById('commentInput');if(ci)ci.value='';
  document.getElementById('memberInfo').classList.remove('show');
  document.getElementById('prevVote').classList.remove('show');
  document.getElementById('formWrapper').style.display='';
  document.getElementById('successScreen').classList.remove('show');
  currentMember=null;prevAttendance=null;
  loadInit();
});

/* ===== 관리자 ===== */
document.getElementById('adminBtn').addEventListener('click',()=>{
  openModal(
    '<h3>⚙️ 관리자 로그인</h3>'+
    '<div class="field"><label class="main-label">비밀번호</label>'+
    '<input type="password" id="adminPwInput" placeholder="비밀번호" autocomplete="off" /></div>'+
    '<div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">취소</button>'+
    '<button class="btn-primary" onclick="adminAuth()">로그인</button></div>'
  );
  setTimeout(()=>{
    const el=document.getElementById('adminPwInput');
    if(el){el.focus();el.addEventListener('keydown',(e)=>{if(e.key==='Enter'){e.preventDefault();adminAuth()}})}
  },80);
});
async function adminAuth(){
  const pw=document.getElementById('adminPwInput').value;
  try{
    const r=await fetchJsonp(SCRIPT_URL,{action:'adminAuth',password:pw});
    if(r.ok){adminPw=pw;openAdminPanel()}
    else{toast('비밀번호가 틀렸습니다','error')}
  }catch(e){toast('통신 실패','error')}
}
function openAdminPanel(){
  const daysHtml=currentDays.map((d,i)=>
    '<div class="admin-day-row" data-idx="'+i+'">'+
      '<label class="sub-label">제목</label>'+
      '<input type="text" class="adm-day-title" value="'+esc(d.title)+'" />'+
      '<label class="sub-label">태그(영문 ID)</label>'+
      '<input type="text" class="adm-day-id" value="'+esc(d.id)+'" />'+
      '<label class="sub-label">설명</label>'+
      '<textarea class="adm-day-desc" rows="3">'+esc(d.desc)+'</textarea>'+
      '<div class="admin-day-actions"><button class="btn-sm btn-danger" onclick="admRemoveDay('+i+')">삭제</button></div>'+
    '</div>'
  ).join('');
  openModal(
    '<h3>⚙️ 관리자 설정</h3>'+
    '<div class="field"><label class="main-label">📢 공지사항</label>'+
    '<textarea id="admNotice" rows="4">'+esc(noticeText)+'</textarea></div>'+
    '<div class="field"><label class="main-label">📅 참석 가능일 / 설명</label>'+
    '<div id="admDays">'+daysHtml+'</div>'+
    '<button class="tg-btn" onclick="admAddDay()" style="margin-top:8px">+ 날짜 추가</button></div>'+
    '<div class="modal-actions">'+
      '<button class="btn-danger" onclick="admResetPage()">🔄 페이지 초기화</button>'+
      '<button class="btn-secondary" onclick="closeModal()">닫기</button>'+
      '<button class="btn-primary" onclick="admSave()">저장</button>'+
    '</div>'
  );
}
function collectAdminDays(){
  const rows=document.querySelectorAll('#admDays .admin-day-row');
  const list=[];
  rows.forEach(r=>{
    const id=r.querySelector('.adm-day-id').value.trim();
    const title=r.querySelector('.adm-day-title').value.trim();
    const desc=r.querySelector('.adm-day-desc').value;
    if(id&&title)list.push({id,title,desc});
  });
  return list;
}
function admAddDay(){
  const notice=document.getElementById('admNotice').value;
  const list=collectAdminDays();
  list.push({id:'sat',title:'토요일',desc:'📍 중문고 체육관\n🕖 19:00 ~ 21:00'});
  noticeText=notice;currentDays=list;
  openAdminPanel();
}
function admRemoveDay(i){
  const notice=document.getElementById('admNotice').value;
  const list=collectAdminDays();
  list.splice(i,1);
  noticeText=notice;currentDays=list;
  openAdminPanel();
}
async function admSave(){
  const notice=document.getElementById('admNotice').value;
  const days=collectAdminDays();
  if(days.length===0){toast('최소 1개 이상의 날짜가 필요합니다','error');return}
  try{
    const r=await fetchJsonp(SCRIPT_URL,{action:'saveConfig',password:adminPw,notice,days});
    if(r.ok){
      noticeText=notice;currentDays=days;
      renderNotice();renderDays();
      closeModal();toast('설정 저장 완료','success');
    }else{toast(r.message||'저장 실패','error')}
  }catch(e){toast('통신 실패','error')}
}
async function admResetPage(){
  const ok=await confirmModal('모든 참석 기록이 백업 후 삭제됩니다. 계속하시겠습니까?');
  if(!ok){openAdminPanel();return}
  try{
    const r=await fetchJsonp(SCRIPT_URL,{action:'adminReset',password:adminPw});
    if(r.ok){closeModal();toast('페이지가 초기화되었습니다','success');loadInit()}
    else{toast(r.message||'초기화 실패','error')}
  }catch(e){toast('통신 실패','error')}
}

/* ===== 참가 현황 ===== */
document.getElementById('attSummaryBtn').addEventListener('click',()=>{
  document.getElementById('statusBtn').click();
});
document.getElementById('statusBtn').addEventListener('click',()=>{
  // 캐시된 데이터가 있으면 즉시 렌더 후 백그라운드로 최신화
  if(dataReady)renderStatusModal();
  else{
    openModal('<h3>📊 참가 인원 현황</h3><p style="text-align:center;color:#888;padding:30px 0">불러오는 중...</p>');
    _statusOpen=true;
  }
  loadInit().then(()=>{if(_statusOpen)renderStatusModal()});
});
function renderStatusModal(){
  const noticeBody=noticeText.trim()
    ?'<div class="notice-content">'+esc(noticeText)+'</div>'
    :'<div class="notice-content"><span class="notice-empty">공지사항이 없습니다.</span></div>';
  const noticeSection='<div class="notice-box" style="margin-bottom:14px"><div class="notice-label">📢 공지사항</div>'+noticeBody+'</div>';
  const commentHtml=getCommentHtml();
  const commentBody=commentHtml||'<span class="comment-empty">아직 남긴 한마디가 없습니다.</span>';

  const voted={};

  const noneAll=[];
  currentMembers.forEach(m=>{
    if(!voted[m.name]&&m.memberType==='정회원')noneAll.push(m.name);
  });
  const sections=currentDays.map(d=>{
    const yes=[],no=[];
    currentMembers.forEach(m=>{
      const a=voted[m.name];
      if(!a)return;
      const isRegular=m.memberType==='정회원';
      if(a.days.includes('모두 불참')){
        if(isRegular)no.push(m.name);
        return;
      }
      if(a.days.includes(d.title))yes.push(m.name);
      else if(isRegular)no.push(m.name);
    });
    return '<div class="status-section"><h4>'+esc(d.title)+'</h4>'+
      '<div class="status-row"><span><span class="tag tag-yes">참석</span>'+yes.length+'명</span></div>'+
      '<div class="status-names">'+(yes.map(esc).join(', ')||'-')+'</div>'+
      '<div class="status-row"><span><span class="tag tag-no">불참</span>'+no.length+'명</span></div>'+
      '<div class="status-names">'+(no.map(esc).join(', ')||'-')+'</div>'+
      '</div>';
  }).join('');
  const noneSection='<div class="status-section none"><h4>미투표</h4>'+
    '<div class="status-row"><span><span class="tag tag-none">미투표</span>'+noneAll.length+'명</span></div>'+
    '<div class="status-names">'+(noneAll.map(esc).join(', ')||'-')+'</div>'+
    '</div>';
  const html='<h3>📊 참가 인원 현황</h3>'+noticeSection+commentSection+sections+noneSection+
    '<div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">닫기</button></div>';
  // 백그라운드 갱신 결과가 동일하면 다시 그리지 않는다 (스크롤 위치 유지)
  if(_statusOpen&&_lastStatusHtml===html)return;
  _lastStatusHtml=html;
  openModal(html);
  _statusOpen=true;
}

/* ===== 팀 생성기 ===== */
let tgDay='',tgMode='num',tgNumTeams=2,tgTeams=[],tgPool=[];
let tgSameConstraints=[],tgDiffConstraints=[],tgExcluded=new Set();
let tgSavedDate='';   // 불러온 저장분을 수정 중이면 그 날짜 (재저장 시 이 날짜를 덮어씀)

document.getElementById('teamBtn').addEventListener('click',async()=>{
  // 캐시된 데이터가 있으면 기다리지 않고 바로 연다

    openModal('<h3>🏀 팀 생성기</h3><p style="text-align:center;color:#888;padding:30px 0">불러오는 중...</p>');
    await loadInit();
  }else{
    // 배정 작업 중 화면이 튀지 않도록, 최신 데이터는 조용히 갱신만 한다
    loadInit();
  }
  if(currentDays.length>0&&!currentDays.some(d=>d.title===tgDay))tgDay=currentDays[0].title;
  tgTeams=[];tgPool=[];

});
function tgTeamCount(){return tgMode==='ybob'?2:tgNumTeams}
function tgTeamLabel(i){
  if(tgMode==='ybob')return ['YB','OB'][i]||'';
  return String.fromCharCode(65+i);
}
function renderTeamGenerator(){
  const dayBtns=currentDays.map(d=>
    '<button class="tg-btn'+(tgDay===d.title?' active':'')+'" onclick="tgSetDay(\''+esc(d.title).replace(/'/g,"\\'")+'\')">'+esc(d.title)+'</button>'
  ).join('');
  const compOptions=[
    {mode:'num',n:2,label:'A/B (2팀)'},
    {mode:'num',n:3,label:'A/B/C (3팀)'},
    {mode:'num',n:4,label:'A/B/C/D (4팀)'},
    {mode:'ybob',n:2,label:'YB vs OB'}
  ];
  const compBtns=compOptions.map(c=>{
    const active=(tgMode===c.mode)&&(c.mode==='ybob'||tgNumTeams===c.n);
    return '<button class="tg-btn'+(active?' active':'')+'" onclick="tgSetComposition(\''+c.mode+'\','+c.n+')">'+c.label+'</button>';
  }).join('');
  openModal(
    '<h3>🏀 팀 생성기</h3>'+
    '<div class="tg-field"><label>진행일</label><div class="tg-btn-row">'+dayBtns+'</div></div>'+
    '<div class="tg-field"><label>팀 구성</label><div class="tg-btn-row">'+compBtns+'</div></div>'+
    '<div class="modal-actions">'+
      '<button class="btn-primary" onclick="tgBuild()">수동 배정</button>'+
      '<button class="btn-primary" onclick="tgRandom()">🎲 랜덤 배정</button>'+
      '<button class="btn-secondary" onclick="tgLoadSaved()">저장된 팀<br>불러오기</button>'+
    '</div>'+
    '<div id="tgResult"></div>'
  );
  renderTeamResult();
}
function tgSetDay(d){tgDay=d;tgSavedDate='';renderTeamGenerator()}
function tgSetComposition(mode,n){
  tgMode=mode;
  if(mode==='ybob')tgNumTeams=2;else tgNumTeams=n;
  tgTeams=[];tgPool=[];
  tgDiffConstraints=tgDiffConstraints.map(members=>members.slice(0,tgNumTeams));
  renderTeamGenerator();
}
function getAttendees(day){
  const voted=currentAttendance.filter(a=>a.days.includes(day)).map(a=>a.name);
  return currentMembers.filter(m=>voted.includes(m.name));
}
function collectGuests(){
  // 다이얼로그로 추가한 임시 게스트(isAdHoc)만 수집.
  // 시트 등록 게스트는 getAttendees()에서 이미 포함되므로 중복 방지.
  const guests=[];
  tgTeams.forEach(t=>t.forEach(m=>{if(m&&m.isAdHoc)guests.push(m)}));
  tgPool.forEach(m=>{if(m&&m.isAdHoc)guests.push(m)});
  return guests;
}
function tgBuild(){
  tgSavedDate='';
  const attendees=getAttendees(tgDay);
  const guests=collectGuests();
  if(tgMode==='ybob'){
    tgTeams=[[],[]];
    const unknown=[];
    attendees.forEach(m=>{
      const age=parseInt(m.age,10);
      if(isNaN(age)){unknown.push(m);return}
      if(age>=40)tgTeams[1].push(m);else tgTeams[0].push(m);
    });
    tgPool=unknown.concat(guests);
  }else{
    tgPool=attendees.concat(guests);
    tgTeams=Array.from({length:tgNumTeams},()=>[]);
  }
  renderTeamResult();
}
function tgRandom(){
  tgSavedDate='';
  const attendees=getAttendees(tgDay);
  const guests=collectGuests();
  if(attendees.length===0&&guests.length===0){toast(tgDay+' 참석자가 없습니다','error');return}
  if(tgMode==='ybob'){tgBuild();return}

  const allPlayersRaw=attendees.concat(guests);
  const excludedPlayers=allPlayersRaw.filter(m=>tgExcluded.has(m.name));
  const allPlayers=allPlayersRaw.filter(m=>!tgExcluded.has(m.name));
  if(allPlayers.length===0){tgTeams=Array.from({length:tgNumTeams},()=>[]);tgPool=[...excludedPlayers];renderTeamResult();return}
  const nameToPlayer={};
  allPlayers.forEach(m=>{nameToPlayer[m.name]=m});

  const validSame=tgSameConstraints.map(members=>members.filter(n=>n&&nameToPlayer[n])).filter(g=>g.length>=2);
  const validDiff=tgDiffConstraints.map(members=>members.filter(n=>n&&nameToPlayer[n])).filter(g=>g.length>=2);

  // Union-Find로 같은 팀 그룹 생성
  const parent={};
  allPlayers.forEach(m=>{parent[m.name]=m.name});
  function find(x){if(parent[x]!==x)parent[x]=find(parent[x]);return parent[x]}
  function union(x,y){const px=find(x),py=find(y);if(px!==py)parent[px]=py}
  validSame.forEach(members=>{for(let i=1;i<members.length;i++)union(members[0],members[i])});

  const groupMap={};
  allPlayers.forEach(m=>{const root=find(m.name);if(!groupMap[root])groupMap[root]=[];groupMap[root].push(m)});
  const groups=Object.values(groupMap);

  // 단독 그룹(제약 없음)과 묶음 그룹 분리
  const singleGroups=groups.filter(g=>g.length===1);
  const multiGroups=groups.filter(g=>g.length>1);

  // 포지션 분산 점수 (낮을수록 균형)
  function balanceScore(teams){
    return ['가드','포워드','센터'].reduce((sum,pos)=>{
      const counts=teams.map(t=>t.filter(m=>m.position===pos).length);
      const avg=counts.reduce((a,b)=>a+b,0)/teams.length;
      return sum+counts.reduce((s,c)=>s+(c-avg)*(c-avg),0);
    },0);
  }

  let bestTeams=null,bestViolations=Infinity,bestBalance=Infinity;

  for(let attempt=0;attempt<80;attempt++){
    const teams=Array.from({length:tgNumTeams},()=>[]);

    // 묶음 그룹 먼저 배정 (매 시도마다 순서 섞기)
    [...multiGroups].sort(()=>Math.random()-.5).forEach(group=>{
      const ti=teams.map((t,i)=>({i,n:t.length})).sort((a,b)=>a.n-b.n)[0].i;
      [...group].sort(()=>Math.random()-.5).forEach(m=>teams[ti].push(m));
    });

    // 단독 인원은 포지션별(G→F→C→기타)로 분류 후 최소 팀에 순차 배정
    const byPos={가드:[],포워드:[],센터:[],기타:[]};
    singleGroups.forEach(g=>{(byPos[g[0].position]||byPos.기타).push(g[0])});
    Object.keys(byPos).forEach(p=>byPos[p].sort(()=>Math.random()-.5));
    ['가드','포워드','센터','기타'].forEach(pos=>{
      byPos[pos].forEach(m=>{
        const ti=teams.map((t,i)=>({i,n:t.length})).sort((a,b)=>a.n-b.n)[0].i;
        teams[ti].push(m);
      });
    });

    const violations=validDiff.filter(members=>{
      const idxs=members.map(name=>{let r=-1;teams.forEach((t,i)=>{if(t.some(m=>m.name===name))r=i});return r}).filter(i=>i!==-1);
      return new Set(idxs).size<idxs.length;
    }).length;

    const balance=balanceScore(teams);

    if(violations<bestViolations||(violations===bestViolations&&balance<bestBalance)){
      bestViolations=violations;
      bestBalance=balance;
      bestTeams=teams.map(t=>[...t]);
      if(violations===0&&balance===0)break;
    }
  }

  // 각 팀 내 G→F→C→기타 순 정렬
  const sortOrder={가드:0,포워드:1,센터:2};
  bestTeams.forEach(t=>t.sort((a,b)=>(sortOrder[a.position]??3)-(sortOrder[b.position]??3)));

  tgTeams=bestTeams;
  tgPool=[...excludedPlayers];
  if(bestViolations>0)toast('일부 다른 팀 조건을 만족하지 못했습니다','error');
  renderTeamResult();
}
function tgAddSame(){tgSameConstraints.push(['','']);renderTeamGenerator()}
function tgAddSameMember(rowIdx){if(tgSameConstraints[rowIdx])tgSameConstraints[rowIdx].push('');renderTeamGenerator()}
function tgUpdateSame(rowIdx,mIdx,val){if(tgSameConstraints[rowIdx])tgSameConstraints[rowIdx][mIdx]=val}
function tgRemoveSame(rowIdx){tgSameConstraints.splice(rowIdx,1);renderTeamGenerator()}
function tgAddDiff(){tgDiffConstraints.push(['','']);renderTeamGenerator()}
function tgAddDiffMember(rowIdx){if(tgDiffConstraints[rowIdx]&&tgDiffConstraints[rowIdx].length<tgNumTeams)tgDiffConstraints[rowIdx].push('');renderTeamGenerator()}
function tgUpdateDiff(rowIdx,mIdx,val){if(tgDiffConstraints[rowIdx])tgDiffConstraints[rowIdx][mIdx]=val}
function tgRemoveDiff(rowIdx){tgDiffConstraints.splice(rowIdx,1);renderTeamGenerator()}
function tgExclude(pi){const m=tgPool[pi];if(m)tgExcluded.add(m.name);renderTeamResult()}
function tgUnexclude(pi){const m=tgPool[pi];if(m)tgExcluded.delete(m.name);renderTeamResult()}

      if(isExcl){

      return '<span class="pool-player">'+posTag(m.position)+nameSpan+teamBtns(i)+

  const hasTeams=tgTeams.some(t=>t.length>0);
  const copyHtml=hasTeams?
    '<div class="copy-box"><pre id="tgCopyText">'+esc(tgCopyText())+'</pre>'+
    '<button class="btn-copy" onclick="tgDoCopy()">📋 복사하기</button> '+
    '<button class="btn-copy" id="tgSaveBtn" style="background:#1565c0" onclick="tgSaveTeams()">💾 팀 저장</button>'+
    '<div style="font-size:.75rem;color:#4a7a4a;margin-top:8px;line-height:1.5">'+
    '저장 대상: <b>'+esc(tgTargetDate())+'</b> · '+esc(tgDay)+
    (tgSavedDate?' (불러온 내용을 수정합니다)':'')+'<br>'+
    '저장하면 📝 기록지 메뉴에서 이 팀을 그대로 불러올 수 있습니다.</div></div>':'';

  // 분배 조건 (팀 배정과 대기 사이)
  const rtAll=[...getAttendees(tgDay),...collectGuests()];
  const rtPosOrd={가드:0,포워드:1,센터:2};
  const rtPosLbl={가드:'G',포워드:'F',센터:'C'};
  rtAll.sort((a,b)=>(rtPosOrd[a.position]??3)-(rtPosOrd[b.position]??3));
  const mkSel=(value,handler)=>{
    const opts=rtAll.map(m=>{
      const pos=rtPosLbl[m.position]||'-';
      const lbl=pos+' '+m.name+(m.isGuest?' (게스트)':'');
      return '<option value="'+esc(m.name)+'"'+(m.name===value?' selected':'')+'>'+esc(lbl)+'</option>';
    }).join('');
    return '<select onchange="'+handler+'"><option value="">-- 선택 --</option>'+opts+'</select>';
  };
  const sameRows=tgSameConstraints.map((members,ri)=>{
    const sels=members.map((name,mi)=>mkSel(name,'tgUpdateSame('+ri+','+mi+',this.value)')).join('');
    return '<div class="constraint-row">'+sels+

      '<button onclick="tgRemoveSame('+ri+')">✕</button></div>';
  }).join('');
  const diffRows=tgDiffConstraints.map((members,ri)=>{
    const sels=members.map((name,mi)=>mkSel(name,'tgUpdateDiff('+ri+','+mi+',this.value)')).join('');
    const addBtn=members.length<tgNumTeams?'<button onclick="tgAddDiffMember('+ri+')" style="background:var(--green);color:#fff;border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:.75rem;flex-shrink:0">+</button>':'';

  const constraintHtml=

function tgCopyText(){
  const nameFor=(m)=>{
    if(m.isGuest)return '게스트('+String(m.name||'').trim()+')';
    const s=String(m.name||'').trim();
    return s.length<=1?s:s.slice(1);
  };
  const lines=[tgDay+' 팀 배정'];
  tgTeams.forEach((t,i)=>{
    if(t.length===0)return;
    lines.push(tgTeamLabel(i)+'팀 : '+t.map(m=>nameFor(m)).join(' '));
  });
  return lines.join('\n');
}
function tgDoCopy(){
  const text=tgCopyText();
  const done=()=>toast('복사되었습니다','success');
  const fallback=()=>{
    const ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand('copy');done()}catch(e){toast('복사 실패','error')}
    document.body.removeChild(ta);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  }else{fallback()}
}
function tgRemove(ti,mi){
  const m=tgTeams[ti].splice(mi,1)[0];
  if(m)tgPool.push(m);
  renderTeamResult();
}
function tgAssign(pi,ti){
  const count=tgTeamCount();
  const m=tgPool.splice(pi,1)[0];
  if(!m||ti<0||ti>=count){if(m)tgPool.push(m);renderTeamResult();return}
  tgTeams[ti].push(m);renderTeamResult();
}
function tgDeleteGuest(pi){
  const m=tgPool[pi];
  if(!m||!m.isAdHoc)return;
  tgPool.splice(pi,1);
  renderTeamResult();
}

/* onclick="..." 속성 안에 넣을 문자열용 이스케이프.
   따옴표는 JS 문자열로, 나머지는 HTML 속성으로 안전하게 만든다. */
function jsq(s){
  return String(s==null?'':s)
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'")
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

const KOR_WD={'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
const WD_NAMES=['일','월','화','수','목','금','토'];

/* 기기 시간대와 무관하게 한국 시각 기준으로 계산한다
   (해외/시간대 오설정 기기에서 요일 판정이 틀어지지 않도록) */
function kstNow(){
  const d=new Date();
  return new Date(d.getTime()+d.getTimezoneOffset()*60000+9*3600000);
}
function fmtDate(d){
  const p=(n)=>('0'+n).slice(-2);
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function parseDate(s){
  const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?new Date(+m[1],+m[2]-1,+m[3]):null;
}
function dayWeekday(title){
  const m=String(title||'').match(/([일월화수목금토])\s*요일/);
  return m?KOR_WD[m[1]]:-1;
}
/* 참석 데이터는 매주 월요일 06:00 에 초기화되므로(weeklyAutoReset)
   "이번 주"의 기준도 월요일 06:00 로 맞춘다. */
function weekStart(now){
  const cur=now.getDay();
  const mon=new Date(now);
  mon.setDate(now.getDate()+(cur===0?-6:1-cur));
  mon.setHours(6,0,0,0);
  if(now<mon)mon.setDate(mon.getDate()-7);
  return mon;
}
/* 이번 주 안에서 해당 요일의 실제 날짜 */
function dayDateInWeek(title,now){
  const n=now||kstNow();
  const wd=dayWeekday(title);
  if(wd<0){const d=new Date(n);d.setHours(0,0,0,0);return d}
  const mon=weekStart(n);
  const d=new Date(mon);
  d.setDate(mon.getDate()+((wd===0?7:wd)-1));
  d.setHours(0,0,0,0);
  return d;
}
/* 그 날 경기가 이미 끝났는지 (22:00 기준) */
function isDayPassed(title){
  if(dayWeekday(title)<0)return false;
  const now=kstNow();
  const d=dayDateInWeek(title,now);
  d.setHours(22,0,0,0);
  return now>d;
}

/* =========================================================
 *  1-2. 영상 링크 (유튜브 등)
 *  서버는 [날짜, 게임번호, 링크] 배열로 내려준다. 게임번호 0 = 그 날 전체 영상
 * ========================================================= */
function ytId(u){
  const t=String(u||'').trim();
  const m=t.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|live\/|shorts\/))([A-Za-z0-9_-]{11})/);
  if(m)return m[1];
  return /^[A-Za-z0-9_-]{11}$/.test(t)?t:'';
}
/* 유튜브면 표준 주소로 정리(시작 시간 t= 는 유지), 그 밖의 주소는 그대로 쓴다 */
function vidNorm(u){
  const t=String(u||'').trim();
  if(!t)return '';
  const id=ytId(t);
  if(!id)return /^https?:\/\//i.test(t)?t:'';
  const sec=t.match(/[?&#]t=(\d+)/);
  return 'https://www.youtube.com/watch?v='+id+(sec?'&t='+sec[1]:'');
}
function vidKey(d,g){return d+'|'+(Number(g)||0)}
function vidMap(list){
  const m={};
  (list||[]).forEach(v=>{const u=vidNorm(v[2]);if(u)m[vidKey(v[0],v[1])]=u});
  return m;
}
/* 게임 전용 링크가 없으면 그 날 전체 영상으로 대체한다 */
function vidFind(map,d,g){
  if(!map)return '';
  return map[vidKey(d,g)]||map[vidKey(d,0)]||'';
}
function vidLink(url,label,cls){
  return '<a class="'+(cls||'ps-yt')+'" href="'+esc(url)+'" target="_blank" rel="noopener">▶ '+esc(label)+'</a>';
}

/* 배경색 밝기에 따라 글자색을 검정/흰색으로 자동 선택 */
function rsFg(hex){
  const h=String(hex||'').replace('#','');
  if(h.length<6)return '#ffffff';
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  if(isNaN(r)||isNaN(g)||isNaN(b))return '#ffffff';
  return (0.299*r+0.587*g+0.114*b)>150?'#1a1a1a':'#ffffff';
}

    cells+='<div class="'+cls+'"'+(future?'':' onclick="rsPickPast(\''+ds+'\')"')+'>'+d+'</div>';

    '<div class="ps-cwd">'+['일','월','화','수','목','금','토'].map(w=>'<div>'+w+'</div>').join('')+'</div>'+
    '<div class="ps-cal pick">'+cells+'</div>'+
    '<p class="ps-hint">초록색은 팀·기록이 저장된 날짜입니다.<br>다른 날짜를 골라도 바로 팀 배정을 할 수 있습니다.</p>'+
    '<div class="modal-actions"><button class="btn-secondary" onclick="closePopup()">취소</button></div>');
}
/* 입력해 둔 기록이 있는지 */
function rsHasInput(){
  return Object.keys(rsStats).some(n=>RS_KEYS.some(k=>(rsStats[n][k]||0)>0));
}
function rsPickPast(date){
  if(rsHasInput()){
    popupHtml('<h3>입력 중인 기록이 있습니다</h3>'+
      '<p class="pop-msg">다른 날짜로 시작하면 지금 입력한 기록은 사라집니다.\n계속할까요?</p>'+
      '<div class="modal-actions">'+
      '<button class="btn-secondary" onclick="rsPastDialog()">돌아가기</button>'+
      '<button class="btn-danger" onclick="rsPickPastGo(\''+jsq(date)+'\')">새 날짜로 시작</button></div>');
    return;
  }
  rsPickPastGo(date);
}
function rsPickPastGo(date){
  closePopup();
  rsStats={};rsHist=[];      // 날짜가 바뀌면 입력 중이던 기록은 비운다
  rsPast=true;
  rsDate=date;
  const saved=rsMarks[date];
  const d=parseDate(date);
  if(saved){
    rsDay=saved;
  }else if(d){
    // 저장 기록이 없으면 고른 날짜의 실제 요일을 진행일로 쓴다.
    // (설정된 진행일과 같은 요일이면 그 제목을 그대로 사용)
    const m=currentDays.find(x=>dayWeekday(x.title)===d.getDay());
    rsDay=m?m.title:WD_NAMES[d.getDay()]+'요일';
  }
  rsLoadTeams();
}

async function rsLoadTeams(){
  if(rsBusy)return;
  rsBusy=true;
  rsLoadedFrom='';
  const body=document.getElementById('rsSetupBody');
  if(body)body.innerHTML='<p class="ld">저장된 팀을 불러오는 중...</p>';
  const want=rsDate;
  try{
    const r=await fetchJsonp(SCRIPT_URL,{action:'getTeams',day:rsPast?'':rsDay,date:rsDate});
    if(r&&r.ok){
      // 서버는 요청한 날짜가 없으면 "가장 최근 저장분"을 대신 돌려준다.
      // 지난 경기는 사용자가 콕 집은 날짜이므로 그 날짜의 저장분만 인정한다.
      const loaded=(r.teams&&r.teams.length&&(!rsPast||r.date===want))?r.teams:null;
      if(loaded){
        if(rsPast){
          if(r.day)rsDay=r.day;          // 날짜(rsDate)는 고른 그대로 유지
        }else if(r.date&&r.date!==want){
          // 이번 주 배정이 없어 예전 배정을 대신 불러온 경우.
          // 기록은 반드시 이번 주 날짜로 저장되어야 하므로 rsDate 는 바꾸지 않는다.
          rsLoadedFrom=r.date;
        }
        rsTeams=loaded.map((t,i)=>({
          label:t.label||'',
          color:t.color||rsDefaultColor(i),
          members:(t.members||[]).map(m=>({name:m.name,position:m.position||'',memberType:m.memberType||''}))
        }));
        rsTeams.forEach(t=>t.members.forEach(m=>rsGet(m.name)));
        if(rsMatch[0]>=rsTeams.length||rsMatch[1]>=rsTeams.length)rsMatch=[0,Math.min(1,rsTeams.length-1)];
        rsSaveDraft();
      }else if(rsPast){
        // 지난 경기는 "불러오기"가 아니라 "입력"이다.
        // 저장분이 없으면 빈 팀만 준비하고, 설정 화면에서 바로 명단을 넣는다.
        rsTeams=[{label:'A',color:rsDefaultColor(0),members:[]},
                 {label:'B',color:rsDefaultColor(1),members:[]}];
        rsMatch=[0,1];
      }else if(rsTeams.some(t=>t.members.length)){
        // 저장된 팀이 없더라도 직접 구성해 둔 팀은 지우지 않는다 (그대로 수정해서 쓰면 됨)
        toast(rsDate+' 로 저장된 팀이 없어 현재 팀을 그대로 씁니다','error');
      }else{
        rsTeams=[];
      }
    }else{
      toast((r&&r.message)||'불러오기 실패','error');
    }
  }catch(e){toast('통신 실패','error')}
  finally{rsBusy=false;rsRenderSetup()}
}
function rsBlankTeams(){
  rsTeams=[{label:'A',color:rsDefaultColor(0),members:[]},{label:'B',color:rsDefaultColor(1),members:[]}];
  rsMatch=[0,1];
  rsSaveDraft();rsRenderSetup();
}
function rsAddTeam(){
  const label=String.fromCharCode(65+rsTeams.length);
  rsTeams.push({label,color:rsDefaultColor(rsTeams.length),members:[]});
  rsSaveDraft();rsRenderSetup();
}
/* 잘못 추가한 팀 되돌리기. 팀은 최소 2개는 남긴다. */
function rsRemoveTeam(i){
  const t=rsTeamAt(i);
  if(!t)return;
  if(rsTeams.length<=2){toast('팀은 2개 이상이어야 합니다','error');return}
  if(t.members.length){
    popupHtml('<h3>'+esc(t.label)+'팀 제거</h3>'+
      '<p class="pop-msg">'+t.members.length+'명이 들어 있습니다.\n제거하면 이 팀의 명단과 기록이 사라집니다.</p>'+
      '<div class="modal-actions">'+
      '<button class="btn-secondary" onclick="closePopup()">취소</button>'+
      '<button class="btn-danger" onclick="rsRemoveTeamGo('+i+')">제거</button></div>');
    return;
  }
  rsRemoveTeamGo(i);
}
function rsRemoveTeamGo(i){
  closePopup();
  const gone=rsTeams.splice(i,1)[0];
  if(gone)gone.members.forEach(m=>{
    delete rsStats[m.name];
    rsHist=rsHist.filter(h=>h.name!==m.name);
  });
  // A,B,C… 로 라벨을 다시 매긴다 (YB/OB 처럼 직접 지은 이름은 건드리지 않는다)
  rsTeams.forEach((t,k)=>{if(/^[A-Z]$/.test(t.label))t.label=String.fromCharCode(65+k)});
  rsMatch=[0,Math.min(1,rsTeams.length-1)];
  rsSaveDraft();rsRenderSetup();
  toast('팀을 제거했습니다','success');
}
/* ===== 유니폼색 (기록지 시작 후, 게임마다 변경) ===== */
function rsColorDialog(){
  const cards=rsMatch.map(ti=>{

    return '<div class="rs-card">'+

      '<input type="color" value="'+esc(c)+'" onchange="rsSetColor('+ti+',this.value)" '+
      'style="width:34px;height:28px;padding:0;border:1px solid #ddd;border-radius:6px;background:none;cursor:pointer" />'+
      '</div></div>';
  }).join('');

function rsSetColor(i,c){
  if(!rsTeams[i])return;
  rsTeams[i].color=c;
  rsSaveDraft();
  if(rsView==='sheet'){rsRenderSheet();rsColorDialog()}
  else rsRenderSetup();
}
function rsSetMatch(a,b){rsMatch=[a,b];rsTab=0;rsSaveDraft();rsRenderSetup()}
function rsSetGame(v){rsGame=Math.max(1,parseInt(v,10)||1);rsSaveDraft()}
function rsStart(){
  if(rsTeams.length<2){toast('팀이 2개 이상 필요합니다','error');return}
  if(!rsDate){toast('날짜를 선택해 주세요','error');return}
  if(rsMatch[0]===rsMatch[1]){toast('서로 다른 두 팀을 선택해 주세요','error');return}
  rsTab=0;rsMode=1;
  rsRenderSheet();
}

/* ===== 기록지 본화면 ===== */
function rsTotals(ti){
  const t=rsTeamAt(ti);
  const o=rsBlank();
  o.pts=0;
  if(t)t.members.forEach(m=>{
    const s=rsGet(m.name);
    RS_KEYS.forEach(k=>{o[k]+=(s[k]||0)});
    o.pts+=rsPts(s);
  });
  return o;
}
function rsScoreHtml(){
  return rsMatch.map((ti,idx)=>{
    const t=rsTeamAt(ti);
    if(!t)return '';
    const c=t.color||'#8d8d8d';
    const cell='<div class="sc" style="background:'+esc(c)+';color:'+rsFg(c)+'">'+
      '<div class="sc-t">'+esc(t.label)+'팀</div><div class="sc-n">'+rsTotals(ti).pts+'</div></div>';
    return idx===0?cell+'<div class="sc-vs">VS</div>':cell;
  }).join('');
}
function rsTableHtml(ti){
  const t=rsTeamAt(ti);
  if(!t)return '';
  const bg=t.color||'#2c5f2e',fg=rsFg(bg);
  const hs='background:'+esc(bg)+';color:'+fg;
  const head1=RS_VIEW.map(c=>'<th class="rs-code">'+c.code+'</th>').join('');
  const head2=RS_VIEW.map(c=>'<th>'+c.ko+'</th>').join('');

  const body=t.members.map((m,mi)=>{
    const s=rsGet(m.name);
    const cells=RS_VIEW.map(c=>{
      if(c.t==='pts')
        return '<td class="rs-ro rs-pts" id="rc-'+ti+'-'+mi+'-pts">'+rsPts(s)+'</td>';
      if(c.t==='pct')
        return '<td class="rs-ro" id="rc-'+ti+'-'+mi+'-'+c.code+'">'+rsPct(s[c.m],s[c.a])+'</td>';
      const v=s[c.k]||0;
      return '<td class="rs-cell'+(v?'':' zero')+'" id="rc-'+ti+'-'+mi+'-'+c.k+'" '+
        'onclick="rsBump('+ti+','+mi+',\''+c.k+'\')">'+v+'</td>';
    }).join('');
    return '<tr><td class="rs-name">'+
      '<button class="rs-nbtn" onclick="rsPlayerMenu('+ti+','+mi+')" title="팀 이동 / 제외">'+esc(m.name)+'</button>'+
      '</td>'+cells+'</tr>';
  }).join('')||'<tr><td class="rs-name">-</td><td colspan="'+RS_VIEW.length+'" style="padding:16px;color:#aaa;font-size:.85rem">선수를 추가해 주세요</td></tr>';

  const tot=rsTotals(ti);
  const totCells=RS_VIEW.map(c=>{
    if(c.t==='pts')return '<td class="rs-pts" id="rt-'+ti+'-pts">'+tot.pts+'</td>';
    if(c.t==='pct')return '<td class="rs-ro" id="rt-'+ti+'-'+c.code+'">'+rsPct(tot[c.m],tot[c.a])+'</td>';
    return '<td id="rt-'+ti+'-'+c.k+'">'+(tot[c.k]||0)+'</td>';
  }).join('');

  return '<div class="rs-tblwrap"><table class="rs-tbl">'+
    '<thead>'+
      '<tr style="'+hs+'"><th class="rs-name rs-code" style="'+hs+'">'+esc(t.label)+'팀</th>'+head1+'</tr>'+
      '<tr style="'+hs+'"><th class="rs-name" style="'+hs+'">선 수</th>'+head2+'</tr>'+
    '</thead>'+
    '<tbody>'+body+'</tbody>'+
    '<tfoot><tr><td class="rs-name" style="padding:0 7px;font-weight:800;font-size:.84rem">합계</td>'+totCells+'</tr></tfoot>'+
    '</table></div>';
}
function rsRenderSheet(){
  rsView='sheet';
  const wide=rsIsWide();
  rsWideMode=wide;
  if(wide)rsTab=0;

  // 좁은 화면: 팀 탭으로 전환 / 넓은 화면: 두 팀을 위아래로 한 번에
  const tabsHtml=wide?'':
    '<div class="rs-row">'+rsMatch.map((ti,i)=>{
      const t=rsTeamAt(ti);
      if(!t)return '';
      const c=t.color||'#8d8d8d';
      const on=(rsTab===i);
      return '<button class="rs-tab'+(on?' on':'')+'" onclick="rsSetTab('+i+')" '+
        'style="'+(on?'background:'+esc(c)+';color:'+rsFg(c)+';border-color:'+esc(c):'')+'">'+
        esc(t.label)+'팀 기록지</button>';
    }).join('')+'</div>';

  const tables=wide
    ? rsMatch.map(ti=>rsTableHtml(ti)).join('<div style="height:16px"></div>')
    : rsTableHtml(rsMatch[rsTab]);

  openModal(
    '<div class="rs-toolbar">'+
      '<div class="rs-hd" style="margin-bottom:8px"><h3 style="font-size:1.02rem">📝 기록지</h3>'+
      '<span class="rs-sub">'+esc(rsDate)+' · '+esc(rsDay||'-')+' · '+rsGame+'게임</span></div>'+
      '<div class="rs-score" id="rsScore">'+rsScoreHtml()+'</div>'+
      tabsHtml+
      '<div class="rs-row">'+
        '<button class="rs-mbtn on" id="rsModePlus" onclick="rsSetMode(1)">＋ 입력</button>'+
        '<button class="rs-mbtn minus" id="rsModeMinus" onclick="rsSetMode(-1)">－ 취소</button>'+
        '<button class="rs-tool warn" onclick="rsUndo()">↩ 실행취소</button>'+
      '</div>'+
      '<div class="rs-row">'+
        '<button class="rs-tool" onclick="rsColorDialog()">🎽 유니폼색</button>'+
        '<button class="rs-tool" onclick="rsAddPlayerDialog()">＋ 선수 추가</button>'+
        '<button class="rs-tool" onclick="rsRenderSetup()">⚙ 팀·게임 설정</button>'+
        '<button class="rs-tool vid" onclick="rsVideoDialog()">🎬 영상 링크</button>'+
        rotateBtnHtml()+
        '<button class="rs-tool go" id="rsSaveBtn" onclick="rsSaveGame()" style="margin-left:auto">💾 게임 저장</button>'+
      '</div>'+
    '</div>'+
    tables+
    '<p class="ps-note" style="margin-top:9px">'+
      '＋ 또는 －를 고른 뒤 칸을 누르면 개수가 오르내립니다. '+
      '<b>성공</b>을 누르면 <b>시도</b>도 자동으로 함께 올라갑니다. '+
      '선수 이름을 누르면 팀 이동·제외를 할 수 있습니다.</p>'+
    '<div style="text-align:center;margin-top:12px">'+
    '<button class="rs-tool" onclick="closeModal()">닫기</button></div>',
    true
  );
  rsSetMode(rsMode);
}
/* 창 크기가 모바일↔PC 경계를 넘으면 레이아웃을 다시 그린다 */
let _rsResizeTimer=null;
window.addEventListener('resize',()=>{
  if(rsView!=='sheet')return;
  if(!document.getElementById('modal').classList.contains('show'))return;
  clearTimeout(_rsResizeTimer);
  _rsResizeTimer=setTimeout(()=>{
    if(rsView==='sheet'&&rsIsWide()!==rsWideMode)rsRenderSheet();
  },200);
});
/* 좁은 화면에서만 노출되는 가로 보기 버튼 (기록지·선수 스탯 공용) */
function rotateBtnHtml(){
  if(window.innerWidth>=900)return '';
  return '<button class="rs-tool" id="rsRotBtn" onclick="rsToggleRotate()">'+
    (rsRotOn?'📱 세로 보기':'🔄 가로 보기')+'</button>';
}
function rsSetTab(i){rsTab=i;rsRenderSheet()}
function rsSetMode(v){
  rsMode=v;
  const box=document.getElementById('modalBox');
  if(box)box.classList.toggle('rs-minus',v<0);
  const p=document.getElementById('rsModePlus'),m=document.getElementById('rsModeMinus');
  if(p)p.classList.toggle('on',v>0);
  if(m)m.classList.toggle('on',v<0);
}
function rsFlash(id){
  const el=document.getElementById(id);
  if(!el)return;
  el.classList.remove('hit');
  void el.offsetWidth;          // 애니메이션 재시작
  el.classList.add('hit');
  setTimeout(()=>el.classList.remove('hit'),360);
}
function rsBump(ti,mi,key){
  const t=rsTeamAt(ti);
  const m=t&&t.members[mi];
  if(!m)return;
  const s=rsGet(m.name),d=rsMode;
  const ch=[[key,d]];
  if(RS_ATT[key])ch.push([RS_ATT[key],d]);   // 성공 +1 → 시도도 +1
  for(let i=0;i<ch.length;i++){
    if((s[ch[i][0]]||0)+ch[i][1]<0){toast('0보다 작아질 수 없습니다','error');return}
  }
  // 시도를 줄여서 성공보다 작아지는 것은 막는다
  if(RS_MADE[key]&&d<0&&(s[key]||0)-1<(s[RS_MADE[key]]||0)){
    toast('시도는 성공보다 적을 수 없습니다','error');return;
  }
  ch.forEach(c=>{s[c[0]]=(s[c[0]]||0)+c[1]});
  rsHist.push({name:m.name,ch});
  if(rsHist.length>400)rsHist.shift();
  rsSaveDraft();
  rsSyncRow(ti,mi);
  rsFlash('rc-'+ti+'-'+mi+'-'+key);
}
function rsSyncRow(ti,mi){
  const t=rsTeamAt(ti);
  const m=t&&t.members[mi];
  if(!m)return;
  const s=rsGet(m.name);
  RS_VIEW.forEach(c=>{
    let el;
    if(c.t==='pts'){
      el=document.getElementById('rc-'+ti+'-'+mi+'-pts');
      if(el)el.textContent=rsPts(s);
    }else if(c.t==='pct'){
      el=document.getElementById('rc-'+ti+'-'+mi+'-'+c.code);
      if(el)el.textContent=rsPct(s[c.m],s[c.a]);
    }else{
      el=document.getElementById('rc-'+ti+'-'+mi+'-'+c.k);
      if(el){el.textContent=s[c.k]||0;el.classList.toggle('zero',!s[c.k])}
    }
  });
  const tot=rsTotals(ti);
  RS_VIEW.forEach(c=>{
    let el;
    if(c.t==='pts'){el=document.getElementById('rt-'+ti+'-pts');if(el)el.textContent=tot.pts}
    else if(c.t==='pct'){el=document.getElementById('rt-'+ti+'-'+c.code);if(el)el.textContent=rsPct(tot[c.m],tot[c.a])}
    else{el=document.getElementById('rt-'+ti+'-'+c.k);if(el)el.textContent=tot[c.k]||0}
  });
  const sc=document.getElementById('rsScore');
  if(sc)sc.innerHTML=rsScoreHtml();
}
function rsUndo(){
  const h=rsHist.pop();
  if(!h){toast('되돌릴 입력이 없습니다','error');return}
  const s=rsGet(h.name);
  h.ch.forEach(c=>{s[c[0]]=Math.max(0,(s[c[0]]||0)-c[1])});
  rsSaveDraft();
  // 화면에 떠 있는 팀이면 해당 행만 갱신
  rsMatch.forEach(ti=>{
    const t=rsTeamAt(ti);
    if(!t)return;
    for(let i=0;i<t.members.length;i++)if(t.members[i].name===h.name)rsSyncRow(ti,i);
  });
  toast('되돌렸습니다','success');
}

/* ===== 팀 이동 / 선수 추가·제외 ===== */
function rsPlayerMenu(ti,mi){
  const t=rsTeamAt(ti);
  const m=t&&t.members[mi];
  if(!m)return;
  const moves=rsTeams.map((tt,i)=>i===ti?'':
    '<button class="btn-primary" style="flex:1;min-width:92px;padding:11px;border-radius:10px;border:none;'+
    'font-family:inherit;font-weight:700;cursor:pointer;font-size:.88rem" '+
    'onclick="rsMove('+ti+','+mi+','+i+')">'+esc(tt.label)+'팀으로</button>').filter(Boolean).join('');
  popupHtml(
    '<h3>'+esc(m.name)+'</h3>'+
    '<p class="pop-sub">현재 '+esc(t.label)+'팀 · 이번 게임 '+rsPts(rsGet(m.name))+'점</p>'+
    '<div class="modal-actions" style="margin-top:14px">'+(moves||'<span style="font-size:.85rem;color:#aaa">이동할 다른 팀이 없습니다</span>')+'</div>'+
    '<div class="modal-actions">'+
      '<button class="btn-secondary" onclick="closePopup()">취소</button>'+
      '<button class="btn-danger" onclick="rsDropPlayer('+ti+','+mi+')">이 게임에서 제외</button>'+
    '</div>'
  );
}
function rsMove(ti,mi,to){
  const t=rsTeamAt(ti),d=rsTeamAt(to);
  if(!t||!d)return;
  const m=t.members.splice(mi,1)[0];
  if(m)d.members.push(m);       // 기록은 이름 기준이라 이동해도 그대로 따라간다
  closePopup();
  rsSaveDraft();

/* ===== 화면 회전 (가로 보기) =====
 *  안드로이드 크롬: 전체화면 + 방향 잠금(네이티브)
 *  iOS 사파리: 방향 잠금 API 자체가 없으므로 CSS 로 화면을 90도 돌린다 */
function rsToggleRotate(){
  if(rsRotOn){rsRotOff();return}
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  const lockable=window.screen&&screen.orientation&&screen.orientation.lock;
  if(req&&lockable){
    Promise.resolve(req.call(el))
      .then(()=>screen.orientation.lock('landscape'))
      .then(()=>{rsRotOn=true;rsRotNative=true;rsRotBtnLabel();toast('가로 모드','success')})
      .catch(()=>{
        try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen()}catch(e){}
        rsCssRotate();
      });
  }else{
    rsCssRotate();
  }
}
function rsCssRotate(){
  document.body.classList.add('rs-rot');
  rsRotOn=true;rsRotNative=false;
  rsRotBtnLabel();
  toast('가로 보기 (버튼을 다시 누르면 해제)','success');
}
function rsRotOff(){
  if(rsRotNative){
    try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock()}catch(e){}
    try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen()}catch(e){}
  }
  document.body.classList.remove('rs-rot');
  rsRotOn=false;rsRotNative=false;
  rsRotBtnLabel();
}
function rsRotBtnLabel(){
  const b=document.getElementById('rsRotBtn');
  if(b)b.textContent=rsRotOn?'📱 세로 보기':'🔄 가로 보기';
}
document.addEventListener('fullscreenchange',()=>{
  // 사용자가 뒤로가기 등으로 전체화면을 빠져나간 경우 상태를 되돌린다
